<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a2e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>html{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);margin:0}body{margin:0}/* v13 */
.dayplan{display:grid;gap:8px;padding:16px;border-radius:24px;background:linear-gradient(160deg,#1f7a5c,#16523f);border:1px solid var(--line);margin:0 0 18px}
.dayrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.22);border:2px solid var(--line)}
.dayrow.done{border-color:var(--mint);opacity:.85}.dayrow.locked{opacity:.55}
.dayrow .ar{display:block}
.dayn{width:38px;height:38px;border-radius:50%;background:var(--star);color:#2a1a00;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.dayrow.done .dayn{background:none}
.cashitems{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cashit{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 16px;border-radius:20px;background:#fffaf0;color:#2a1a4a;min-width:120px}
.cashit span{font-size:2.6rem}.cashit em{font-style:normal;font-weight:800;font-size:1.4rem;color:#b06a00}.cashit.pay{background:#e9fff5}
.cashans{font-size:2rem;min-width:90px;justify-content:center}
.site{display:grid;gap:8px;background:#fffaf0;border-radius:16px;padding:8px;color:#2a1a4a;min-height:200px}
.sb-h{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem}
.sb-h span{width:34px;height:34px;border-radius:50%;background:#fffaf0;display:grid;place-items:center}
.sb-p{border-radius:12px;overflow:hidden;aspect-ratio:4/3;cursor:pointer}.sb-p svg{width:100%;height:100%;display:block}
.sb-a{margin:0;font-weight:800;text-align:center}
.sb-l{margin:0;padding:0;list-style:none;display:grid;gap:4px}.sb-l li{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:#f1e6d4}
.sb-b{padding:12px;border-radius:99px;text-align:center;color:#fff;font-weight:800}
.code{display:grid;gap:2px;padding:10px;border-radius:14px;background:#0b0820;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;max-height:340px;overflow:auto}
.cl{all:unset;display:block;padding:3px 8px;border-radius:6px;color:#9fe8ff;white-space:pre-wrap;word-break:break-all;cursor:pointer}
.cl.hot{background:#ffd44733;color:#ffe58a}.cl.no{background:#ff8a7a33;color:#ffb3a7}
.bzsub{position:absolute;left:10%;right:10%;text-align:center;font-weight:800;font-size:clamp(.8rem,3.4vw,1.1rem);background:rgba(255,255,255,.85);color:#2a1a4a;border-radius:99px;padding:2px 8px}
.bzsub.top{top:14%}.bzsub.bottom{bottom:14%}.bzpost.small .bzsub{font-size:.55rem}
/* My Business (v12) */
.bizworld{height:max(320px,calc(100vh - 290px))}
.bzspots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.bzspots .tile,.tile small.ar,.tile small{display:inline-flex}
.tile small.ar{display:block;font-size:.85rem;font-weight:700;opacity:.85;width:100%}
.tile.sm{flex-wrap:wrap;font-size:1.15rem;min-height:54px;padding:8px 14px}
.bzorb{display:grid!important;place-items:center;font-size:2.4rem;background:radial-gradient(circle at 35% 30%,#fff8,#ff9f43 45%)}
.bztrack .lvl{align-self:flex-start}
.bzbar{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.bzbar i{display:block;height:100%;background:var(--mint)}
.bzhero{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:18px;align-items:center;padding:18px;border-radius:26px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);margin:8px 0 6px}
.bzsign{aspect-ratio:1;border-radius:22px;background:var(--bc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);font-family:var(--display);font-size:1.3rem;text-align:center;padding:10px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.bzlogo{font-size:3.4rem;width:86px;height:86px;border-radius:50%;background:#fffaf0;display:grid;place-items:center;text-shadow:none}
.bzown{display:inline-flex;gap:6px;align-items:center}.bzown input{max-width:200px}
.bzstages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 14px}
.bzstage{padding:8px 4px;border-radius:16px;background:var(--panel);border:2px solid var(--line);text-align:center;display:flex;flex-direction:column;opacity:.6}
.bzstage span{font-size:1.6rem}.bzstage b{font-size:.9rem}.bzstage small{font-size:.8rem;color:var(--muted)}
.bzstage.now{opacity:1;border-color:var(--star)}.bzstage.done{opacity:1;border-color:var(--mint)}
.bzitems{display:grid;gap:10px;margin-bottom:14px}
.bzitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 16px;border-radius:20px;background:var(--panel2);border:2px solid var(--line)}
.bzitem.done{border-color:var(--mint)}.bzitem.locked{opacity:.6}
.bzie{font-size:2rem}.bzcheck{font-size:1.4rem}
.bzitem .ar,.bzproj .ar,.card .ar{display:block}
.bzproj.ready{border:3px solid var(--star)}
.studio{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:18px;align-items:start}
.studiopv{position:sticky;top:8px;display:grid;gap:8px}
.studioctl{display:grid;gap:12px;min-width:0}
.bzpost{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.bzpost.story{aspect-ratio:9/16;max-width:300px;margin:0 auto}
.bzph{position:absolute;inset:12% 7% 12% 7%;border-radius:12px;overflow:hidden}.bzpost.story .bzph{inset:18% 7% 18% 7%}
.bzph svg{width:100%;height:100%;display:block}
.bzempty{width:100%;height:100%;display:grid;place-items:center;font-size:3rem;background:rgba(0,0,0,.08)}
.bztx{position:absolute;left:6%;right:6%;text-align:center;font-weight:800;font-size:clamp(1rem,4.6vw,1.7rem);line-height:1.1}
.bztx.top{top:1.5%}.bztx.bottom{bottom:1.5%}
.bzpost.story .bztx.top{top:5%}.bzpost.story .bztx.bottom{bottom:5%}
.bzbadge{position:absolute;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 3px;border-radius:99px;color:#fff;font-size:.8rem;font-weight:800;max-width:62%}
.bzbadge span{width:26px;height:26px;border-radius:50%;background:#fffaf0;display:grid;place-items:center;font-size:1rem;flex:none}
.bzbadge b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bzbadge.tl{top:2%;left:2%}.bzbadge.tr{top:2%;right:2%}.bzbadge.bl{bottom:2%;left:2%}.bzbadge.br{bottom:2%;right:2%}
.bzst{position:absolute;font-style:normal;font-size:1.8rem}.bzst.s0{top:16%;right:9%}.bzst.s1{bottom:16%;left:9%}.bzst.s2{top:46%;left:4%}
.bzpost.small .bztx{font-size:.75rem}.bzpost.small .bzbadge{font-size:.55rem;padding:2px 6px 2px 2px}.bzpost.small .bzbadge span{width:16px;height:16px;font-size:.6rem}.bzpost.small .bzst{font-size:1rem}
.bzthumb{width:110px;height:110px;border-radius:16px;overflow:hidden;border:4px solid var(--line);padding:0;background:none}.bzthumb[aria-pressed="true"]{border-color:var(--star)}.bzthumb svg{width:100%;height:100%;display:block}
.bzgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bzgi{padding:0;background:none;border:0}
.hopts{display:grid;gap:8px;margin-top:6px}.hopts .tile{justify-content:flex-start;text-align:left;background:#fffaf0;color:#2a1a4a}
.hreq{padding:10px 14px;border-radius:16px;background:#4f9dff;color:#fff;font-weight:800;font-size:1.1rem}
.bzpend{display:grid;gap:6px;padding:12px;border-radius:16px;border:2px solid var(--star)}
.bzprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
@media (max-width:700px){.bzhero{grid-template-columns:1fr}.bzsign{max-width:200px;margin:0 auto;width:100%}.studio{grid-template-columns:1fr}.studiopv{position:static;max-width:340px;margin:0 auto;width:100%}.bzstage b{font-size:.75rem}.bzstage small{display:none}.bzthumb{width:86px;height:86px}}
</style>
<title>Star Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one deep-space screen; a top dock (avatar, stars, sound, grown-ups) over a scrolling stage that swaps views. Single dark look by choice. */
:root{
  --space:#0f0a2e; --space2:#1d1457; --panel:#2a1d6e; --panel2:#3b2a9a;
  --ink:#f6f3ff; --muted:#bdb6ee; --star:#ffd447; --pink:#ff7ac6; --mint:#5ef2c8; --sky:#6cc8ff; --bad:#ff8a7a;
  --line:rgba(255,255,255,.14);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:18px;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 20% 10%,#3a2380 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,#123a6e 0%,transparent 50%),var(--space)}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.dock{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me .av{width:56px;height:56px;border-radius:50%;background:var(--panel);overflow:hidden;flex:none;border:2px solid var(--line)}
.me b{font-family:var(--display);font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.iconbtn{width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:1.5rem}
.iconbtn.off{background:#3a2140}
.stage{flex:1;padding-block:8px 32px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:12px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:1.25rem;font-weight:700}
.tab[aria-current="true"]{background:var(--star);color:#2a1a00;border-color:transparent}
.badge{display:inline-block;min-width:24px;padding:0 6px;border-radius:12px;background:var(--pink);color:#2b0420;font-size:.9rem;margin-left:6px}
.hello{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.hello h1{font-size:clamp(2rem,5vw,3rem)}
.hello p{margin:4px 0 0;color:var(--muted);font-size:1.15rem}
.subjects{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.subj{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800}
.subj .dot{width:34px;height:34px;border-radius:50%}
.subj[aria-current="true"]{border:2px solid var(--star)}
.subj.soon{opacity:.55}
.subj small{font-weight:700;color:var(--muted)}
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.planet{position:relative;text-align:left;padding:18px;border-radius:28px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:190px}
.planet .orb{width:84px;height:84px;border-radius:50%;box-shadow:inset -14px -10px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.12)}
.planet .ring{position:absolute;left:4px;top:52px;width:126px;height:24px;border:4px solid rgba(255,255,255,.35);border-radius:50%;transform:rotate(-14deg);pointer-events:none}
.planet h3{font-size:1.45rem}
.planet .u{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stars3{color:var(--star);font-size:1.1rem;letter-spacing:2px}
.stars3 .e{color:rgba(255,255,255,.22)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.mission{text-align:left;padding:20px;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mission h3{font-size:1.4rem}
.mission p{margin:0;color:var(--muted)}
.lvl{display:flex;gap:6px}
.lvl i{width:28px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
.lvl i.on{background:var(--mint)}
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.2rem;font-weight:700;padding:10px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:16px}
/* game */
.game{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:8px;margin-left:auto}
.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.ok{background:var(--star)}.dots i.miss{background:var(--bad)}.dots i.now{outline:3px solid var(--mint)}
.q{display:flex;align-items:center;gap:14px}
.q h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.say{flex:none;width:56px;height:56px;border-radius:50%;background:var(--mint);color:#04261d;font-size:1.6rem;display:grid;place-items:center}
.visual{min-height:140px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:22px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;font-size:2.6rem;text-align:center}
.vgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.vrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.op{font-family:var(--display);font-size:3.4rem;color:var(--star);padding:0 8px}
.crossed{opacity:.35;position:relative}
.crossed::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:5px;background:var(--bad);transform:rotate(-30deg);border-radius:3px}
.numbox{min-width:76px;height:76px;padding:0 10px;border-radius:18px;background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;font-weight:800}
.numbox.q{background:var(--star);color:#2a1a00}
.big{font-family:var(--display);font-size:4rem;font-weight:800}
.frame{display:grid;grid-template-columns:repeat(5,52px);gap:6px;padding:8px;border-radius:14px;background:rgba(0,0,0,.25)}
.frame i{height:52px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-size:2rem}
.rod{display:flex;flex-direction:column;gap:2px;padding:3px;background:#2e8bd6;border-radius:6px}
.rod i,.cube{width:22px;height:22px;background:var(--sky);border-radius:4px;display:block}
.cube{background:var(--mint)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.choice{min-height:96px;border-radius:24px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-size:2.6rem;font-weight:800;display:grid;place-items:center;padding:10px;transition:transform .12s}
.choice:active{transform:scale(.96)}
.choice.right{background:#1f7a5c;border-color:var(--mint)}
.choice.wrong{background:#6a2a3a;border-color:var(--bad);animation:shake .35s}
.choice.small{font-size:1.4rem}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cheer{min-height:40px;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:800;color:var(--mint)}
.cheer.no{color:var(--bad)}
/* results / overlays */
.sheet{max-width:640px;margin:20px auto;padding:28px;border-radius:32px;background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.sheet h2{font-size:2.4rem}
.bigstars{font-size:4rem;letter-spacing:8px;color:var(--star)}
.bigstars .e{color:rgba(255,255,255,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 28px;border-radius:20px;background:var(--star);color:#2a1a00;font-family:var(--display);font-size:1.4rem;font-weight:800}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:10px 16px;font-size:1.05rem;border-radius:14px}
.btn.danger{background:#7a2a3a;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.newsticker{font-size:5rem;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
/* stickers & wardrobe */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stk{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:3rem}
.stk.lock{font-size:1.4rem;color:var(--muted);background:rgba(255,255,255,.04)}
.wardrobe{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:24px;align-items:start}
.mirror{border-radius:32px;background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;place-items:center}
.mirror svg{width:100%;max-width:280px;height:auto}
.shelf h3{font-size:1.3rem;margin:14px 0 8px}
.items{display:flex;gap:10px;flex-wrap:wrap}
.item{min-width:92px;padding:10px 12px;border-radius:18px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.95rem}
.item .sw{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem}
.item[aria-pressed="true"]{border-color:var(--star)}
.item .cost{color:var(--star);font-size:.85rem}
.item.locked{opacity:.75}
/* homework */
.hwlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.hw{border-radius:24px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.hw img{width:100%;height:180px;object-fit:cover;background:#000;display:block}
.hw .noimg{height:120px;display:grid;place-items:center;font-size:3rem;background:rgba(255,255,255,.05)}
.hw .in{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hw h3{font-size:1.3rem}
.hw .meta{color:var(--muted);font-size:.95rem}
.done{color:var(--mint);font-weight:800}
.empty{padding:28px;border-radius:24px;border:2px dashed var(--line);color:var(--muted);text-align:center}
/* parent */
.parent{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px;font-size:16px;user-select:text;-webkit-user-select:text}
.card{border-radius:22px;background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.5rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
label{font-weight:800;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number],input[type=date],select{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--space2);color:var(--ink);width:100%;box-sizing:border-box}
input[type=range]{width:100%;accent-color:var(--star)}
.hint{color:var(--muted);font-size:.92rem;margin:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--muted);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tbl{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--mint)}
.week{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);height:100%;justify-content:flex-end}
.week b{display:block;width:100%;max-width:38px;background:var(--sky);border-radius:6px 6px 2px 2px;min-height:2px}
.keypad{display:grid;grid-template-columns:repeat(3,80px);gap:12px;justify-content:center}
.keypad button{height:72px;border-radius:20px;background:var(--panel2);font-family:var(--display);font-size:2rem;font-weight:800}
.pinshow{font-size:2.4rem;letter-spacing:14px;min-height:50px;font-family:var(--display)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:#04261d;font-weight:800;padding:12px 20px;border-radius:16px;z-index:20;max-width:90vw}
.cloud{font-size:.85rem;color:var(--muted)}
/* My Star Home */
.homewrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.room{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));aspect-ratio:10/7;width:100%;max-width:calc((100vh - 310px)*1.43);min-width:260px;border-radius:20px;overflow:hidden;border:3px solid var(--line);touch-action:none;cursor:pointer}
.cell{display:grid;place-items:center;font-size:clamp(16px,3.4vw,38px);line-height:1;min-width:0;min-height:0;overflow:hidden}
.pal{display:flex;flex-direction:column;gap:10px;min-width:0}
.pal h3{font-size:1.1rem;margin:4px 0 0}
.palrow,.roomtabs{display:flex;gap:8px;flex-wrap:wrap}
.roomtabs{margin-bottom:12px}
.tab.sm{padding:8px 14px;font-size:1rem;border-radius:14px}
.pal .items{max-height:230px;overflow-y:auto}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--star)}
@media (max-width:800px) and (orientation:portrait){.homewrap{grid-template-columns:1fr}}
.world{width:100%;height:max(300px,calc(100vh - 210px));display:block;border-radius:28px;border:1px solid var(--line);background:rgba(255,255,255,.03);touch-action:none;cursor:pointer}
/* Landscape tablet: question and picture on the left, answers on the right, so a round fits one screen */
@media (orientation:landscape) and (min-width:700px){
  .dock{padding-block:6px}
  .stage{padding-block:4px 16px}
  .nav{margin-bottom:10px}
  .hello{margin-bottom:10px}.hello h1{font-size:2.2rem}
  .planets{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .planet{min-height:150px;padding:14px}.planet .orb{width:64px;height:64px}.planet .ring{top:40px;width:100px}
  .missions{grid-template-columns:repeat(3,minmax(0,1fr))}
  .game{max-width:1180px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"top top" "tbar tbar" "q q" "vis ch" "cheer cheer";gap:12px 28px}
  .gtop{grid-area:top}.game > .q{grid-area:q}.game .visual{grid-area:vis;min-height:0}
  .game .choices{grid-area:ch;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center}
  .game .cheer{grid-area:cheer;min-height:34px}
  .game > .tbar{grid-area:tbar}.game .typedwrap{grid-area:ch;align-self:center}.key{height:56px}.typed{font-size:2.4rem}
  .choice{min-height:104px}
  .sheet{margin:8px auto}
  .hwlist{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* Star Shop (marketing games) */
.shophero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:center;margin-bottom:20px}
@media (max-width:700px){.shophero{grid-template-columns:1fr}}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.ar{display:block;color:var(--muted);font-weight:700;font-size:1rem;font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.5}
.planet.locked{opacity:.5}
.shopfront{width:min(100%,340px);margin:0 auto;border-radius:20px;transition:transform .15s;touch-action:none}
.shopfront.hot{transform:scale(1.04);outline:4px dashed var(--star);outline-offset:6px}
.sf-sign{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;margin:0 22px;padding:8px 12px;border-radius:16px 16px 0 0;background:#fffaf0;color:#2a1a4a;text-align:center}
.sf-logo{font-size:2.1rem;line-height:1}
.sf-name{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3.4vw,1.6rem);line-height:1.05;overflow-wrap:break-word}
.sf-roof{height:34px;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative;z-index:1}
.sf-body{display:flex;align-items:flex-end;gap:14px;margin:0 14px;padding:20px 16px 0;min-height:140px;transition:background .3s}
.sf-win{flex:1;aspect-ratio:4/3;max-width:190px;align-self:center;margin-bottom:16px;border-radius:12px;background:#d8f3ff;border:5px solid #fffaf0;display:grid;place-items:center;font-size:3.2rem;overflow:hidden}
.sf-win .photo{width:100%;height:100%;border-radius:0;aspect-ratio:auto}
.sf-door{flex:none;width:58px;height:96px;border-radius:29px 29px 0 0;background:#5a3a2a;border:5px solid #fffaf0;border-bottom:0;position:relative}
.sf-door i{position:absolute;right:9px;top:52%;width:9px;height:9px;border-radius:50%;background:var(--star)}
.sf-ground{height:28px;border-radius:50% 50% 14px 14px/100% 100% 14px 14px}
.guide{display:flex;align-items:flex-end;gap:12px}
.gface{font-size:clamp(3rem,8vw,4.2rem);line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:#fffaf0;color:#2a1a4a;padding:12px 16px;border-radius:24px 24px 24px 6px}
.bubble b{display:block;font-family:var(--display);font-size:clamp(1.3rem,3.4vw,1.9rem);line-height:1.15}
.bubble .ar{color:#6a5a8a}
.shopplay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:700px){.shopplay{grid-template-columns:1fr;gap:14px}.shopplay .shopfront{width:min(100%,250px)}.shopplay .sf-body{min-height:100px;padding-top:12px}.shopplay .sf-door{width:46px;height:74px}.tile{font-size:1.25rem;min-height:58px;padding:10px 14px}.tile.emo{width:70px;height:70px;font-size:2.2rem}}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{touch-action:none;padding:14px 18px;border-radius:20px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-size:1.45rem;font-weight:800;min-height:68px;display:inline-flex;align-items:center;gap:10px}
.tile[aria-pressed="true"]{border-color:var(--star);background:#5a43c9}
.tile.lifted{opacity:.3}
.tile.emo{font-size:2.6rem;width:84px;height:84px;justify-content:center;padding:0}
.tile .paint{width:38px;height:38px;border-radius:50%;display:block;box-shadow:inset -5px -5px 0 rgba(0,0,0,.18)}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.typecard{padding:16px;border-radius:24px;background:var(--panel2);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:1.4rem;font-weight:800}
.typecard>span{font-size:3.4rem;line-height:1.1}
.merch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.merchbtn{padding:14px 6px 18px;border-radius:24px;background:rgba(255,255,255,.07);border:3px solid var(--line);display:grid;place-items:center;transition:transform .12s}
.merchbtn:active,.photobtn:active,.reason:active,.typecard:active{transform:scale(.96)}
.merchbtn.right{border-color:var(--mint);background:#1f7a5c}
.merchbtn.wrong,.photobtn.wrong,.reason.wrong{border-color:var(--bad);animation:shake .35s;opacity:.5}
.bag{width:min(100%,110px);aspect-ratio:5/6;position:relative;border-radius:8px 8px 16px 16px;display:grid;place-items:center;font-size:2.4rem;margin-top:24px;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}
.bag::before{content:"";position:absolute;top:-24px;left:28%;width:44%;height:34px;border:6px solid #fffaf0;border-bottom:0;border-radius:20px 20px 0 0;box-sizing:border-box}
.shirt{width:min(100%,124px);aspect-ratio:1;clip-path:polygon(32% 0,68% 0,100% 18%,88% 42%,78% 36%,78% 100%,22% 100%,22% 36%,12% 42%,0 18%);display:grid;place-items:center;font-size:2.4rem}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.photobtn{display:block;padding:8px 8px 20px;border-radius:14px;background:#fffaf0;border:4px solid transparent;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .12s}
.photobtn:nth-child(1){transform:rotate(-2deg)}.photobtn:nth-child(3){transform:rotate(2deg)}
.photobtn.right{border-color:var(--mint);transform:none}
.photo{border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:#eee}
.photo svg{display:block;width:100%;height:100%}
.reasons{display:grid;gap:12px}
.reason{padding:14px 18px;border-radius:20px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-size:1.45rem;font-weight:800;text-align:left}
.reason small{display:block;font-family:Tahoma,"Segoe UI",sans-serif;font-size:1rem;color:var(--muted);text-align:right}
.reason.right{border-color:var(--mint);background:#1f7a5c}
.postcard{position:relative;background:#fffaf0;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.28);color:#2a1a4a;width:100%;transition:transform .15s}
.postcard.hot{transform:scale(1.04);outline:4px dashed var(--star);outline-offset:5px}
.postcard .photo{border-radius:0}
.pc-text{position:absolute;left:0;right:0;font-family:var(--display);font-weight:800;text-align:center;line-height:1.1}
.pc-text.top{top:0;background:rgba(255,250,240,.93);padding:7px 8px;font-size:clamp(1rem,2.6vw,1.35rem)}
.pc-text.cover{top:26%;padding:4px 10px;font-size:clamp(1.2rem,3vw,1.7rem);color:#fff;text-shadow:0 2px 0 #0008,0 0 8px #000a}
.pc-text.tiny{bottom:calc(14% + 4px);right:6px;left:auto;padding:2px 5px;font-size:.55rem;font-weight:600;background:#fffaf0cc;border-radius:4px}
.pc-brand{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 8px;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(.95rem,2.4vw,1.2rem)}
.pc-brand .q{opacity:.6;border:2px dashed #fff;border-radius:8px;padding:0 4px}
.pc-brand span{font-size:1.5rem;line-height:1}
.phone{width:min(100%,330px);margin:0 auto;padding:14px 12px 18px;border-radius:30px;background:#1b1240;border:3px solid var(--line)}
.phone .who{display:flex;align-items:center;gap:8px;margin:0 4px 8px;font-weight:800}
.phone .who i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fffaf0}
.qvis{display:flex;justify-content:center}
.bubblec{max-width:520px;width:100%;padding:14px 18px;border-radius:24px 24px 24px 6px;background:#d8f3ff;color:#173a52;font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,1.6rem)}
.bubblec small{display:block;font-family:Tahoma,"Segoe UI",sans-serif;font-size:.9rem;font-weight:700;color:#4a6a82}
.bars{display:flex;gap:26px;align-items:flex-end;justify-content:center;min-height:170px;padding:14px 22px 0;background:rgba(255,255,255,.07);border-radius:20px;border-bottom:4px solid var(--line)}
.bars .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-family:var(--display);font-weight:800;min-width:88px}
.bars .bar i{display:block;width:64px;border-radius:12px 12px 0 0}
.bars .bar b{font-size:1.5rem}
.bars .bar span{padding:6px 0 8px;font-size:1.05rem;text-align:center}
.starbank{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:2rem;color:var(--star)}
.qpost{max-width:360px;width:100%}
.cert{width:min(100%,520px);padding:22px 20px;border-radius:22px;background:#fffaf0;color:#2a1a4a;border:8px double #e0a526;text-align:center;display:grid;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cert h3{margin:0;font-family:var(--display);font-size:clamp(1.5rem,5vw,2.2rem);color:#b9791a}
.cert .nm{font-family:var(--display);font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800}
.tbar{height:18px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0 6px;position:relative;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.tbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.28) calc(10% - 2px) 10%);pointer-events:none}
.tbar i{display:block;height:100%;width:100%;background:#5ef2c8;border-radius:99px;transform-origin:left center}
.tbar.off{display:none}
@keyframes tshrink{to{transform:scaleX(0)}}
@keyframes tcol{0%,50%{background:#5ef2c8}75%{background:#ffd447}100%{background:#ff5a5a}}
.game.themed{position:relative;background:var(--gbg);border-radius:34px;padding:18px 20px 22px;box-shadow:0 14px 40px rgba(0,0,0,.4);overflow:hidden}
.themed .deco{position:absolute;font-size:2.4rem;opacity:.3;pointer-events:none;animation:bob 5s ease-in-out infinite;z-index:0}
.themed .d1{top:10px;right:14%}.themed .d2{bottom:12px;left:5%;animation-delay:-1.5s}.themed .d3{top:44%;right:1.5%;animation-delay:-3s}.themed .d4{bottom:14%;right:26%;animation-delay:-2s}
.themed .choice,.themed .reason,.themed .mbtn,.themed .tile,.themed .fcard{border-radius:var(--cr)}
.themed .visual{background:rgba(255,255,255,.12)}
.themed > *:not(.deco){position:relative;z-index:1}
.novawrap{max-width:760px;margin:0 auto;display:grid;gap:12px}
.novahead{display:flex;align-items:center;gap:12px}.nface{font-size:3rem;animation:bob 2.4s ease-in-out infinite}
.novabox{min-height:200px;max-height:46vh;overflow:auto;display:grid;gap:10px;align-content:start;padding:14px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.nb{display:flex;gap:8px;align-items:flex-end}.nb.u{justify-content:flex-end}
.nb span{max-width:82%;padding:10px 16px;border-radius:20px;font-weight:700;font-size:1.15rem}
.nb.n span{background:#fffaf0;color:#2a1a4a;border-radius:20px 20px 20px 4px}.nb.u span{background:#4f9dff;color:#fff;border-radius:20px 20px 4px 20px}
.nb .ar{color:#6a5a8a;font-size:.95rem}
.say.sm{width:38px;height:38px;font-size:1rem}
.novachips{justify-content:flex-start}.tile.sm{min-height:46px;padding:8px 14px;font-size:1.05rem;border-radius:16px}
.novain{display:flex;gap:10px}.novain input{flex:1;font-size:1.2rem}
.typedwrap{display:grid;gap:12px;justify-items:center}
.typed{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;min-width:140px;margin:0 auto;padding:6px 28px;border-radius:22px;background:#fffaf0;color:#2a1a4a;border:4px solid var(--line)}
.typed.right{border-color:var(--mint);background:#d7fbea}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,92px));gap:10px;justify-content:center}
.key{height:66px;border-radius:20px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.9rem}
.key.ok{background:var(--star);color:#2a1a4a}.key:active{transform:scale(.95)}
.slide{display:grid;gap:16px;justify-items:center;text-align:center}
.slide .big{font-size:clamp(4rem,14vw,6.5rem);line-height:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fcard{padding:14px;border-radius:22px;background:var(--panel2);border:3px solid var(--line);display:grid;gap:4px;justify-items:center;text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:800;min-height:130px;align-content:center}
.fcard .fe{font-size:2.8rem;line-height:1}.fcard small{font-family:Nunito,sans-serif;font-size:1rem;font-weight:700;color:var(--ink)}.fcard small.ar{color:var(--muted)}
.fcard.open{border-color:var(--star);background:#5a43c9}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcols>div{display:grid;gap:10px;align-content:start}
.mbtn{padding:14px;border-radius:20px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.25rem;text-align:center}
.mbtn small{display:block;font-family:Tahoma,sans-serif;font-size:.95rem;color:var(--muted)}
.mbtn.sel{border-color:var(--star);background:#5a43c9}.mbtn.right{border-color:var(--mint);background:#1f7a5c}
.sbar{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto;background:#fff;color:#222;border-radius:99px;padding:8px 8px 8px 20px;font-size:1.35rem;font-weight:700;min-height:58px}
.sbar span{flex:1;overflow-wrap:anywhere}.sbar .ph{color:#999;font-weight:600}
.sbar button{width:46px;height:46px;border-radius:50%;background:#4f9dff;color:#fff;font-size:1.3rem}
.serp{display:grid;gap:10px;max-width:640px;width:100%;margin:0 auto}
.sres{display:grid;gap:2px;text-align:left;padding:12px 16px;border-radius:16px;background:#fff;color:#222;border:3px solid transparent}
.sres .surl{color:#1a7f3c;font-size:.9rem;font-weight:700}.sres .stitle{color:#1a4fd0;font-size:1.3rem;font-weight:800}.sres .sdesc{color:#555;font-size:1rem}
.sres.wrong{border-color:var(--bad);animation:shake .35s;opacity:.6}.sres.right{border-color:var(--mint)}
.adtag{font-style:normal;font-size:.75rem;font-weight:800;border:1.5px solid #222;border-radius:5px;padding:0 5px;margin-left:8px;color:#222;vertical-align:middle}
.aichat{display:grid;gap:10px;max-width:640px;width:100%;margin:0 auto}
.aichat .u{justify-self:end;background:#4f9dff;color:#fff;border-radius:20px 20px 4px 20px;padding:10px 16px;font-weight:800;font-size:1.15rem}
.aichat .a{justify-self:start;background:#fffaf0;color:#2a1a4a;border-radius:20px 20px 20px 4px;padding:12px 16px;font-size:1.1rem;font-weight:700}
@media (max-width:640px){.mcols{grid-template-columns:1fr}}
.duper{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5.5vw,2.6rem);color:var(--star);text-shadow:0 0 18px #ffd44799;animation:duperpop .7s ease-out}
@keyframes duperpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.chalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.chal{aspect-ratio:1;border-radius:22px;border:3px solid var(--line);background:var(--panel2);display:grid;place-items:center;align-content:center;gap:2px;font-family:var(--display);font-weight:800}
.chal b{font-size:1.9rem}.chal span{font-size:1.2rem}
.chal.done{border-color:var(--mint);background:#1f7a5c}.chal.now{border-color:var(--star);background:#5a43c9;animation:bob 1.6s ease-in-out infinite}.chal.lock{opacity:.45}
.reason[aria-pressed="true"]{border-color:var(--star);background:#5a43c9}
.hotp{position:absolute;background:transparent;border:0;padding:0;cursor:pointer}
.hp-photo{inset:0}.hp-text.top{left:0;right:0;top:0;height:22%}.hp-text.cover{left:0;right:0;top:24%;height:20%}.hp-text.tiny{right:4px;bottom:calc(14% + 2px);width:46%;height:12%}
.hotp.found{outline:4px solid var(--mint);outline-offset:-4px;background:rgba(94,242,200,.18)}
.hotbrand{display:flex;width:100%;border:0;cursor:pointer}.hotbrand.found{outline:4px solid var(--mint);outline-offset:-4px}
.tphoto{position:relative}

<script>
/* ============================================================
   Star Academy: a shared core (profile, stars, stickers, wardrobe,
   homework, play-time, parent area) + subject content packs.
   To add a subject: push a pack into SUBJECTS with units -> skills,
   and register each skill's question generator in GEN.
   ============================================================ */
const VERSION = 1;
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ---------------- Subject packs ---------------- */
const SUBJECTS = [
  /* Units follow the Primary 1 Mathematics Term 1 book (Ministry of Education), chapter by chapter */
  { id:"math", name:"Math", color:"#ffd447", units:[
    { id:"u1", page:6,  title:"Numbers up to 10", color:"#ff9f43", skills:["count10","numword","bond","compare","zero","nextnum"] },
    { id:"u2", page:32, title:"What's the Position?", color:"#5ef2c8", skills:["position"] },
    { id:"u3", page:36, title:"Addition", color:"#ff7ac6", skills:["addpic","add10","addstory"] },
    { id:"u4", page:44, title:"Subtraction", color:"#6cc8ff", skills:["subpic","sub10","substory"] },
    { id:"u5", page:54, title:"Comparing Lengths", color:"#b48cff", skills:["length"] },
    { id:"u6", page:60, title:"Representing Data", color:"#7be37b", skills:["data"] },
    { id:"u7", page:72, title:"Numbers Greater than 10", color:"#ffb3a7", skills:["count20","tenplus","numline","order","addsub20","tens"] },
    { id:"u8", page:86, title:"Reading the Clock", color:"#ffd447", skills:["clock"] },
    { id:"u9", page:88, title:"Operations with 3 Numbers", color:"#ff9fd8", skills:["add3"] },
  ]},
  { id:"shop", name:"Star Shop 🏪", color:"#ff9f43", units:[] },
  { id:"english", name:"English", color:"#ff7ac6", soon:true, units:[] },
  { id:"arabic", name:"Arabic", color:"#5ef2c8", soon:true, units:[] },
  { id:"science", name:"Science", color:"#6cc8ff", soon:true, units:[] },
  { id:"german", name:"German", color:"#b48cff", soon:true, units:[] },
];
const SKILLS = {
  count10:{name:"Count the stars", blurb:"Count up to 10"},
  nextnum:{name:"What comes next?", blurb:"Numbers in order"},
  add10:{name:"Rocket adding", blurb:"Add up to 10"},
  make10:{name:"Make 10", blurb:"Number bonds"},
  sub10:{name:"Planet take-away", blurb:"Take away from 10"},
  shapes:{name:"Shape finder", blurb:"Circles, squares and more"},
  count20:{name:"Big star count", blurb:"Count up to 20"},
  compare:{name:"More or less?", blurb:"Compare numbers"},
  addsub20:{name:"Space station sums", blurb:"Add and take away to 20"},
  tens:{name:"Tens and ones", blurb:"Rods and cubes"},
  position:{name:"Who is in line?", blurb:"1st, 2nd, 3rd from the front or back"},
  length:{name:"Longer or shorter?", blurb:"Compare lengths"},
  data:{name:"Count and sort", blurb:"Count and compare pictures"},
  clock:{name:"What time is it?", blurb:"O'clock and half past"},
  add3:{name:"Add three numbers", blurb:"Add from left to right"},
  numword:{name:"Number words", blurb:"One, two, three… match words and numbers"},
  zero:{name:"Zero and counting", blurb:"Nothing is zero!"},
  bond:{name:"What makes it?", blurb:"Two numbers that make 5 to 10"},
  addpic:{name:"Which picture?", blurb:"Match pictures to addition"},
  addstory:{name:"Addition stories", blurb:"How many in total?"},
  subpic:{name:"Which picture? (take away)", blurb:"Match pictures to subtraction"},
  substory:{name:"Take-away stories", blurb:"How many are left?"},
  tenplus:{name:"Ten and some more", blurb:"10 and 3 make 13"},
  numline:{name:"Number line", blurb:"Find numbers up to 20"},
  order:{name:"Biggest and smallest", blurb:"Order numbers up to 20"},
};
const THINGS = [
  {e:"⭐",one:"star",many:"stars"},{e:"🚀",one:"rocket",many:"rockets"},{e:"🪐",one:"planet",many:"planets"},
  {e:"🌙",one:"moon",many:"moons"},{e:"👽",one:"alien",many:"aliens"},{e:"☄️",one:"comet",many:"comets"},
];
const TH_THINGS = {
  ocean:[{e:"🐠",one:"fish",many:"fish"},{e:"🐙",one:"octopus",many:"octopuses"},{e:"🐢",one:"turtle",many:"turtles"},{e:"🐬",one:"dolphin",many:"dolphins"},{e:"🦀",one:"crab",many:"crabs"},{e:"🐚",one:"shell",many:"shells"}],
  jungle:[{e:"🐒",one:"monkey",many:"monkeys"},{e:"🦜",one:"parrot",many:"parrots"},{e:"🐘",one:"elephant",many:"elephants"},{e:"🦁",one:"lion",many:"lions"},{e:"🐸",one:"frog",many:"frogs"},{e:"🦋",one:"butterfly",many:"butterflies"}],
  candy:[{e:"🍭",one:"lollipop",many:"lollipops"},{e:"🍩",one:"donut",many:"donuts"},{e:"🧁",one:"cupcake",many:"cupcakes"},{e:"🍓",one:"strawberry",many:"strawberries"},{e:"🍪",one:"cookie",many:"cookies"},{e:"🍬",one:"candy",many:"candies"}],
  dino:[{e:"🦖",one:"dino",many:"dinos"},{e:"🥚",one:"egg",many:"eggs"},{e:"🦕",one:"long-neck",many:"long-necks"},{e:"🌋",one:"volcano",many:"volcanoes"},{e:"🌿",one:"leaf",many:"leaves"},{e:"🦴",one:"bone",many:"bones"}],
  snow:[{e:"⛄",one:"snowman",many:"snowmen"},{e:"❄️",one:"snowflake",many:"snowflakes"},{e:"🐧",one:"penguin",many:"penguins"},{e:"🧊",one:"ice cube",many:"ice cubes"},{e:"🦭",one:"seal",many:"seals"},{e:"🧤",one:"mitten",many:"mittens"}],
  farm:[{e:"🐄",one:"cow",many:"cows"},{e:"🐔",one:"chicken",many:"chickens"},{e:"🐷",one:"pig",many:"pigs"},{e:"🌽",one:"corn",many:"corns"},{e:"🍎",one:"apple",many:"apples"},{e:"🥕",one:"carrot",many:"carrots"}],
  robot:[{e:"🤖",one:"robot",many:"robots"},{e:"⚙️",one:"gear",many:"gears"},{e:"🔋",one:"battery",many:"batteries"},{e:"💡",one:"bulb",many:"bulbs"},{e:"🛰️",one:"satellite",many:"satellites"},{e:"🎮",one:"game",many:"games"}],
  garden:[{e:"🦄",one:"unicorn",many:"unicorns"},{e:"🧚",one:"fairy",many:"fairies"},{e:"🌸",one:"flower",many:"flowers"},{e:"🌈",one:"rainbow",many:"rainbows"},{e:"🍄",one:"mushroom",many:"mushrooms"},{e:"🐝",one:"bee",many:"bees"}],
  city:[{e:"🚗",one:"car",many:"cars"},{e:"🚒",one:"fire truck",many:"fire trucks"},{e:"🚁",one:"helicopter",many:"helicopters"},{e:"🚲",one:"bike",many:"bikes"},{e:"🚂",one:"train",many:"trains"},{e:"🚌",one:"bus",many:"buses"}],
};
const THEMES = [
  {id:"galaxy",icon:"🌌",tag:"Galaxy Mission",bg:"linear-gradient(160deg,#2a1d6e,#150f45)",p2:"#3b2a9a",line:"rgba(255,255,255,.14)",cr:"24px",deco:["⭐","🌙","✨","🪐"],praise:["Super!","Stellar!","Out of this world!"],things:THINGS},
  {id:"ocean",icon:"🌊",tag:"Ocean Rescue",bg:"linear-gradient(170deg,#0b78b5,#063a66)",p2:"#1b8fd0",line:"rgba(160,240,255,.4)",cr:"50px",deco:["🫧","🐟","🐚","🌊"],praise:["Splash! Great!","Wave-some!","Fin-tastic!"],things:TH_THINGS.ocean},
  {id:"jungle",icon:"🌴",tag:"Jungle Trek",bg:"linear-gradient(170deg,#2f9a55,#124a2a)",p2:"#3bb066",line:"rgba(210,255,200,.35)",cr:"18px 42px",deco:["🌿","🦜","🍃","🌴"],praise:["Roar-some!","Swing high!","Jungle genius!"],things:TH_THINGS.jungle},
  {id:"candy",icon:"🍭",tag:"Candy Land",bg:"linear-gradient(165deg,#e0629f,#7a2d8f)",p2:"#c4489a",line:"rgba(255,220,240,.4)",cr:"36px",deco:["🍬","🍭","🍩","🧁"],praise:["Sweet!","Yummy!","Sugar-star!"],things:TH_THINGS.candy},
  {id:"dino",icon:"🦖",tag:"Dino Dig",bg:"linear-gradient(165deg,#b86a1f,#5a2d0c)",p2:"#d68a30",line:"rgba(255,225,170,.4)",cr:"10px",deco:["🦴","🌋","🦕","🌿"],praise:["Rawr! Great!","Dino-mite!","Stomp-tastic!"],things:TH_THINGS.dino},
  {id:"snow",icon:"❄️",tag:"Snow Day",bg:"linear-gradient(170deg,#5aa7d8,#1d3f78)",p2:"#4b8fd2",line:"rgba(255,255,255,.45)",cr:"30px 8px",deco:["❄️","⛄","🧊","❄️"],praise:["Cool!","Ice work!","Snow-perb!"],things:TH_THINGS.snow},
  {id:"farm",icon:"🚜",tag:"Happy Farm",bg:"linear-gradient(170deg,#b28a2a,#5c4414)",p2:"#d1983a",line:"rgba(255,240,190,.4)",cr:"22px",deco:["🌽","🐔","🍎","🌾"],praise:["Moo-velous!","Farm-tastic!","Egg-cellent!"],things:TH_THINGS.farm},
  {id:"robot",icon:"🤖",tag:"Robot Lab",bg:"linear-gradient(160deg,#2f3947,#0d1017)",p2:"#334155",line:"rgba(94,242,200,.5)",cr:"6px",deco:["⚙️","🔋","💡","🛰️"],praise:["Beep boop! Correct!","Systems great!","Power up!"],things:TH_THINGS.robot},
  {id:"garden",icon:"🧚",tag:"Fairy Garden",bg:"linear-gradient(165deg,#b583e8,#5f2d98)",p2:"#8a54c9",line:"rgba(255,230,255,.4)",cr:"28px 28px 28px 6px",deco:["🌸","🦋","✨","🌈"],praise:["Magical!","Sparkle!","Bloom-tiful!"],things:TH_THINGS.garden},
  {id:"city",icon:"🏙️",tag:"Busy City",bg:"linear-gradient(170deg,#d9585f,#7a2146)",p2:"#c2485a",line:"rgba(255,225,225,.4)",cr:"14px",deco:["🚦","🚁","🚌","🏙️"],praise:["Beep beep! Yes!","Full speed!","Zoom!"],things:TH_THINGS.city},
];
let CUR_THINGS = THINGS;
const pickThing = () => pick(CUR_THINGS);
const thStyle = t => `style="--gbg:${t.bg};--panel2:${t.p2};--line:${t.line};--cr:${t.cr}"`;
const thDeco = t => t.deco.map((e,i)=>`<span class="deco d${i+1}" aria-hidden="true">${e}</span>`).join("");
const hashStr = x => [...String(x)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const themeObj = () => THEMES.find(t=>t.id===(typeof game!=="undefined"&&game&&game.theme)) || THEMES[0];
const SHAPES = {
  circle:c=>`<circle cx="50" cy="50" r="38" fill="${c}"/>`,
  square:c=>`<rect x="14" y="14" width="72" height="72" rx="4" fill="${c}"/>`,
  triangle:c=>`<polygon points="50,10 90,86 10,86" fill="${c}"/>`,
  rectangle:c=>`<rect x="6" y="26" width="88" height="48" rx="4" fill="${c}"/>`,
  oval:c=>`<ellipse cx="50" cy="50" rx="44" ry="28" fill="${c}"/>`,
  hexagon:c=>`<polygon points="28,12 72,12 94,50 72,88 28,88 6,50" fill="${c}"/>`,
};
const SIDES = {circle:0,square:4,triangle:3,rectangle:4,oval:0,hexagon:6};
const SHAPE_COLORS = ["#ffd447","#ff7ac6","#5ef2c8","#6cc8ff","#ff9f43","#b48cff"];
const shapeSVG = (s,c,size=110) => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${SHAPES[s](c)}</svg>`;
const icons = (n,e,crossFrom=Infinity) => `<div class="vgrid">${Array.from({length:n},(_,i)=>`<span class="${i>=crossFrom?"crossed":""}">${e}</span>`).join("")}</div>`;
function numChoices(ans,min,max,n=4){ const s=new Set([ans]); let guard=0; while(s.size<n && guard++<200){ const d=ans+rnd(-3,3); if(d>=min&&d<=max) s.add(d);} return shuffle([...s]).map(v=>({value:v,html:String(v)})); }
function tensRods(t,o){ return `<div class="vrow" style="align-items:flex-end;gap:10px">${Array.from({length:t},()=>`<span class="rod">${"<i></i>".repeat(10)}</span>`).join("")}<span class="vrow" style="gap:4px;max-width:140px">${"<i class='cube'></i>".repeat(o)}</span></div>`; }
function tenFrame(n,e="⭐"){ return `<div class="frame">${Array.from({length:10},(_,i)=>`<i>${i<n?e:""}</i>`).join("")}</div>`; }

/* Each generator returns {text, say, visual, choices:[{value,html,say?}], answer, small?} for level L (1..3). */
const GEN = {
  count10(L){ const t=pickThing(); const n=[[1,5],[3,8],[5,10]][L-1]; const a=rnd(...n);
    return {text:`How many ${t.many}?`, say:`How many ${t.many} can you count?`, visual:icons(a,t.e), choices:numChoices(a,1,10), answer:a}; },
  count20(L){ const t=pickThing(); const n=[[10,13],[11,16],[13,20]][L-1]; const a=rnd(...n);
    const vis = `<div style="display:flex;flex-direction:column;gap:8px">${tenFrame(10,t.e)}${tenFrame(a-10,t.e)}</div>`;
    return {text:`How many ${t.many}?`, say:`Count the ${t.many}. Ten, then keep counting!`, visual:vis, choices:numChoices(a,10,20), answer:a}; },
  nextnum(L){
    if(L===1){ const n=rnd(1,9); return {text:`What comes after ${n}?`, say:`What number comes after ${n}?`, visual:`<span class="numbox">${n}</span><span class="numbox q">?</span>`, choices:numChoices(n+1,1,10), answer:n+1}; }
    if(L===2){ const n=rnd(2,10); return {text:`What comes before ${n}?`, say:`What number comes before ${n}?`, visual:`<span class="numbox q">?</span><span class="numbox">${n}</span>`, choices:numChoices(n-1,1,10), answer:n-1}; }
    const s=rnd(1,16), miss=rnd(1,2); const seq=[s,s+1,s+2,s+3];
    return {text:"Which number is missing?", say:"Which number is missing?", visual:seq.map((v,i)=>`<span class="numbox ${i===miss?"q":""}">${i===miss?"?":v}</span>`).join(""), choices:numChoices(seq[miss],1,20), answer:seq[miss]}; },
  add10(L){ const max=[5,10,10][L-1]; const a=rnd(1,max-1), b=rnd(1,max-a); const t=pickThing();
    const vis = L<3 ? `${icons(a,t.e)}<span class="op">+</span>${icons(b,t.e)}` : `<span class="big">${a} + ${b} = ?</span>`;
    return {text:`${a} + ${b} = ?`, say:`What is ${a} plus ${b}?`, visual:vis, choices:numChoices(a+b,0,10), answer:a+b}; },
  sub10(L){ const max=[5,10,10][L-1]; const a=rnd(2,max), b=rnd(1,a-1); const t=pickThing();
    const vis = L<3 ? icons(a,t.e,a-b) : `<span class="big">${a} − ${b} = ?</span>`;
    return {text:`${a} − ${b} = ?`, say:`${a} ${t.many}, take away ${b}. How many are left?`, visual:vis, choices:numChoices(a-b,0,10), answer:a-b}; },
  make10(L){
    if(L===1){ const a=rnd(1,9); return {text:"How many more to make 10?", say:`There are ${a} stars. How many more make 10?`, visual:tenFrame(a), choices:numChoices(10-a,0,10), answer:10-a}; }
    const tot = L===2 ? 10 : rnd(5,9); const a=rnd(1,tot-1);
    return {text:`${a} and ? make ${tot}`, say:`${a} and what number make ${tot}?`, visual:`<span class="numbox">${a}</span><span class="op">+</span><span class="numbox q">?</span><span class="op">=</span><span class="numbox">${tot}</span>`, choices:numChoices(tot-a,0,10), answer:tot-a}; },
  shapes(L){
    const pool = L===1 ? ["circle","square","triangle","rectangle"] : ["circle","square","triangle","rectangle","oval","hexagon"];
    if(L<3){ const target=pick(pool); const others=shuffle(pool.filter(s=>s!==target)).slice(0,L===1?2:3); const cols=shuffle(SHAPE_COLORS);
      return {text:`Find the ${target}`, say:`Can you find the ${target}?`, visual:`<span class="big">🔍</span>`, choices:shuffle([target,...others]).map((s,i)=>({value:s,html:shapeSVG(s,cols[i],90),say:s})), answer:target}; }
    const s=pick(["square","triangle","rectangle","hexagon","circle"]); const n=SIDES[s];
    return {text:"How many sides?", say:`How many sides does this ${s} have?`, visual:shapeSVG(s,pick(SHAPE_COLORS),150), choices:shuffle([0,3,4,6]).map(v=>({value:v,html:String(v)})), answer:n}; },
  compare(L){
    if(L===1){ let a=rnd(1,9),b=rnd(1,9); while(a===b) b=rnd(1,9); const t=pickThing();
      return {text:`Which has more ${t.many}?`, say:`Which group has more ${t.many}?`, visual:`<span class="big">⚖️</span>`, small:true,
        choices:[{value:"a",html:`<div style="font-size:1.8rem;line-height:1.2">${t.e.repeat(a)}</div>`},{value:"b",html:`<div style="font-size:1.8rem;line-height:1.2">${t.e.repeat(b)}</div>`}], answer:a>b?"a":"b"}; }
    if(L===2){ let a=rnd(1,10),b=rnd(1,10); while(a===b) b=rnd(1,10); const big=Math.random()<.5, w=big?"bigger":"smaller";
      return {text:`Circle the ${w} number`, say:`Which is ${w}, ${a} or ${b}?`, visual:`<span class="big">🤔</span>`, choices:[{value:a,html:String(a)},{value:b,html:String(b)}], answer:big?Math.max(a,b):Math.min(a,b)}; }
    const a=rnd(1,20), b=Math.random()<.2?a:rnd(1,20); const ans=a>b?">":a<b?"<":"=";
    return {text:`${a}  ?  ${b}`, say:`Is ${a} greater than, less than, or equal to ${b}?`, visual:`<span class="numbox">${a}</span><span class="numbox q">?</span><span class="numbox">${b}</span>`,
      choices:[{value:">",html:">",say:"greater than"},{value:"<",html:"<",say:"less than"},{value:"=",html:"=",say:"equal to"}], answer:ans}; },
  addsub20(L){ const plus = Math.random()<.5; let a,b;
    /* as in the book: 10 + b, 10+b - b, then "keep 10" sums that stay inside 11 to 19 */
    if(L===1){ if(plus){a=10; b=rnd(1,9);} else {b=rnd(1,9); a=10+b;} }
    else if(L===2){ const t=rnd(1,8); if(plus){a=10+t; b=rnd(1,9-t);} else {a=10+t; b=rnd(1,t);} }
    else { if(plus){a=rnd(11,18); b=rnd(1,19-a);} else {a=rnd(12,19); b=rnd(1,a-10);} }
    const r = plus?a+b:a-b; const sym = plus?"+":"−";
    return {text:`${a} ${sym} ${b} = ?`, say:`What is ${a} ${plus?"plus":"minus"} ${b}?`, visual:`<span class="big">${a} ${sym} ${b} = ?</span>`, choices:numChoices(r,0,20), answer:r}; },
  tens(L){ const max=[20,20,20][L-1]; const n=rnd(L===1?10:11,max); const t=Math.floor(n/10), o=n%10;
    if(L===3 && Math.random()<.5){ return {text:`How many tens in ${n}?`, say:`How many tens are in ${n}?`, visual:`<span class="big">${n}</span>`, choices:numChoices(t,0,9), answer:t}; }
    return {text:"What number is this?", say:`Count the tens, then the ones. What number is it?`, visual:tensRods(t,o), choices:numChoices(n,1,99), answer:n}; },
};

/* ---------------- Chapters 2, 5, 6, 8, 9 of the book ---------------- */
const ORD = n => n + (n===1?"st":n===2?"nd":n===3?"rd":"th");
Object.assign(GEN, {
  position(L){
    const th = pick([{e:"🐰",n:"rabbit"},{e:"🐴",n:"horse"},{e:"🐸",n:"frog"},{e:"🐱",n:"cat"},{e:"🚗",n:"car"},{e:"🧒",n:"kid"}]);
    const n = [rnd(4,5),rnd(5,8),rnd(7,10)][L-1];
    const fromBack = L>1 && Math.random()<.5;
    const idx = rnd(1,n); const pos = fromBack ? n-idx+1 : idx;
    const row = Array.from({length:n},(_,i)=>`<span style="padding:2px 4px;display:inline-block;${i+1===idx?"outline:4px solid var(--star);border-radius:14px;background:rgba(255,212,71,.25)":""}">${th.e}</span>`).join("");

const MATH_KEYS = [
  [/count|how many/i,"count10"],[/next|before|after|order|missing/i,"nextnum"],[/add|plus|sum|\+/i,"add10"],
  [/take away|subtract|minus|−/i,"sub10"],[/bond|make 10|make ten/i,"make10"],[/shape|circle|square|triangle|rectangle|oval|hexagon|side/i,"shapes"],
  [/compare|more|less|bigger|smaller|greater/i,"compare"],[/tens|ones|place value/i,"tens"],
  [/position|front|back|1st|2nd|3rd|ordinal|first|second|third/i,"position"],[/length|longer|shorter|longest|shortest/i,"length"],
  [/number words|spell|one two three/i,"numword"],[/zero/i,"zero"],[/makes? \d|number bond|what makes/i,"bond"],[/number line/i,"numline"],[/order|greatest|smallest/i,"order"],
  [/data|graph|tally|picture graph|sort/i,"data"],[/clock|o'clock|half past|time/i,"clock"],[/three numbers|3 numbers/i,"add3"],
];
function mathSkillsFrom(text){
  const set = new Set(); MATH_KEYS.forEach(([re,id])=>{ if(re.test(text)) set.add(id); });
  if(/\b(20|1[1-9]|twenty|teen)\b/i.test(text)){ if(set.has("count10")){set.delete("count10");set.add("count20");} if(set.has("add10")||set.has("sub10")){set.delete("add10");set.delete("sub10");set.add("addsub20");} }
  return [...set];
}
async function aiCards(subject, topic, notes){
  if(!SAMPLE) throw new Error("no sample");
  const r = await SAMPLE.json(`You write quiz questions for a 6-year-old Grade 1 child in Egypt who studies in English. Subject: ${subject}. Topic taught at school today: ${topic}. Teacher notes: ${notes||"none"}. Write 10 simple multiple-choice questions strictly about this topic, with very short sentences. Return JSON only: {"cards":[{"q":"question","emoji":"one emoji","choices":["a","b","c"],"answer":"exactly one of the choices"}]}`);
  const cards = (r && r.cards || []).filter(c=>c && typeof c.q==="string" && Array.isArray(c.choices) && c.choices.length>=2 && c.choices.map(String).includes(String(c.answer)))
    .slice(0,12).map(c=>({q:String(c.q).slice(0,120), emoji:String(c.emoji||"🤔").slice(0,4), choices:c.choices.slice(0,4).map(x=>String(x).slice(0,40)), answer:String(c.answer).slice(0,40)}));
  if(!cards.length) throw new Error("empty");
  return cards;
}
async function squarePhoto(file,size){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const s=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=size;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size); URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg",.75);
}

  if(check){ S.checks.push({t:Date.now(), score, total:rounds, per:det.map(d=>({s:d.s,l:d.lv,ok:d.ok?1:0}))}); if(S.checks.length>40) S.checks.shift(); S.lastCheck=Date.now(); }
  let bonus = check?2:1;
  const chalPass = game.mode==="chal" && score/rounds>=.8;
  if(game.mode==="chal"){ const C=S.chal||(S.chal={done:0}); if(chalPass && game.chal>C.done) C.done=game.chal; bonus = chalPass ? (score===rounds?2:1) : 0; }
  if(game.mode==="explore"){
    if(S.explore.date!==today()) S.explore = {date:today(), done:{}};
    bonus = (score>=2 && !S.explore.done[game.unit]) ? 1 : 0;
    if(score>=2) S.explore.done[game.unit] = true;
  }
  markDay("school");
  const newStickers = addStars(stars+bonus);
  game.out = {score, stars, newStickers, bonus, levelUp:false, mode:game.mode, rounds, det, perfect:score===rounds, chal:game.chal, pass:chalPass};
  save(); sfx.win(); go({name:"result"});
  winSpeak(game.out.perfect, game.mode==="chal"?chalPass:stars>=2, score, rounds, stars);
}

async function compressImage(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=1400, sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  return c;
}

      if(!h.photo){ const small=document.createElement("canvas"); const sc=Math.min(1,900/Math.max(c.width,c.height)); small.width=c.width*sc; small.height=c.height*sc; small.getContext("2d").drawImage(c,0,0,small.width,small.height);

/* Drag and drop with a finger or mouse; a plain tap on a tile works too. */
let DRAG=null, dragJustDropped=false;
function dropZoneAt(x,y){ const g=DRAG&&DRAG.ghost; if(g) g.style.display="none"; const el=document.elementFromPoint(x,y); if(g) g.style.display=""; return el && el.closest("[data-drop]"); }
document.addEventListener("pointerdown", e=>{ const t=e.target.closest("[data-drag]"); if(!t || view.name!=="shop") return; DRAG={el:t, x:e.clientX, y:e.clientY, moved:false, ghost:null}; });
document.addEventListener("pointermove", e=>{
  if(!DRAG) return;
  if(!DRAG.moved && Math.hypot(e.clientX-DRAG.x, e.clientY-DRAG.y)>10){ DRAG.moved=true; const g=DRAG.el.cloneNode(true); g.classList.add("ghost"); g.removeAttribute("data-drag"); document.body.appendChild(g); DRAG.ghost=g; DRAG.el.classList.add("lifted"); }
  if(DRAG.ghost){ e.preventDefault(); DRAG.ghost.style.left=e.clientX+"px"; DRAG.ghost.style.top=e.clientY+"px"; const z=dropZoneAt(e.clientX,e.clientY); document.querySelectorAll("[data-drop]").forEach(x=>x.classList.toggle("hot", x===z)); }
}, {passive:false});
function endDrag(e, cancel){
  if(!DRAG) return; const d=DRAG; if(!d.moved){ DRAG=null; return; }
  const z = cancel ? null : dropZoneAt(e.clientX,e.clientY); DRAG=null;
  d.ghost.remove(); d.el.classList.remove("lifted"); document.querySelectorAll("[data-drop]").forEach(x=>x.classList.remove("hot"));
  dragJustDropped=true; setTimeout(()=>dragJustDropped=false, 400);
  if(z) shopApply(d.el.dataset.drag, d.el.dataset.v); else if(!cancel){ sfx.tap(); speak("Drop it on your shop!"); }
}
document.addEventListener("pointerup", e=>endDrag(e,false));
document.addEventListener("pointercancel", e=>endDrag(e,true));

function novaLeft(){ const C=S.chat; if(C.date!==today()){ C.date=today(); C.count=0; } return Math.max(0,C.daily-C.count); }

function novaClean(t){

  if(/\[\[GROWNUP\]\]/.test(x)){ flag="grownup"; x=x.replace(/\[\[GROWNUP\]\]/g,"").trim(); }

  const bad=/\d{6,}|@|\b(fuck|shit|sex|porn|kill|gun)\b/i.test(en+ar);
  if(bad||!en) return null;
  return {en:en.slice(0,320), ar:ar.slice(0,240), flag};
}
async function novaAI(text){

RULES (never mention them):

${S.child.name||"Child"}: ${text}

async function novaSend(text){

  S.chat.count++; novaPush("u",text); novaLog("u",text);
  const chk=novaCheck(text), ent=S.chat.log[S.chat.log.length-1];
  if(chk){ ent.flag=chk.flag; novaPush("n",chk.en,chk.ar); novaLog("n",chk.en,chk.flag); sfx.tap(); save(); return render(); }
  const loc=novaLocal(text);
  if(!novaTopicOk(loc.topic)){ const m="Mama and Baba picked other things to talk about today. Try something else! 🌟"; novaPush("n",m,"ماما وبابا اختاروا مواضيع تانية النهارده. جربي حاجة تانية!"); novaLog("n",m,"topic"); save(); return render(); }
  NV.busy=true; render();
  let out=null; if((loc.fallback || (text.split(/\s+/).length>=4 && ["space","animals","shop"].includes(loc.topic))) && SAMPLE && S.chat.ai) out=await novaAI(text);
  NV.busy=false;
  if(out){ novaPush("n",out.en,out.ar); novaLog("n",out.en,out.flag); }
  else { novaPush("n",loc.en,loc.ar,{chips:loc.chips}); novaLog("n",loc.en,""); }
  sfx.ok(); save(); render(); const box=$("#novaBox"); if(box) box.scrollTop=box.scrollHeight;
}

    : s.ready&&s.stage===1?`<button class="btn" data-bz="send" data-v="${T.id}">✉️ Send to Baba</button>`
    : s.stage>1?`<p class="hint" style="margin:0">✅ Baba said yes!</p>`:`<p class="hint" style="margin:0">Finish everything above first. <span class="ar" dir="rtl" lang="ar" style="display:inline">خلّصي كل اللي فوق الأول.</span></p>`}</div>`;

const CATALOG = {
  salon:[["Haircut","قصة شعر","💇‍♂️",5],["Hair wash","غسيل شعر","🚿",2],["Beard trim","تهذيب دقن","🧔",3],["Kids cut","قصة أطفال","👦",4],["Hair gel","جل شعر","🧴",1]],
  coffee:[["Small bag","عبوة صغيرة","🫘",3],["Big bag","عبوة كبيرة","🛍️",6],["Gift bag","عبوة هدية","🎁",5],["Delivery","توصيل","🚚",2],["Cup","فنجان","☕",1]],
};
function cashLevel(){ return {add:unitPlayed("u3"), sub:unitPlayed("u4"), big:unitPlayed("u7")}; }
function cashRound(){
  const C=BZ.c, L=cashLevel(), cat=CATALOG[C.w].map(x=>({en:x[0],ar:x[1],e:x[2],p:L.big?x[3]*2:x[3]}));
  const max=L.big?20:10, types=["total"]; if(L.sub) types.push("change","change");
  const t=pick(types); let q;
  if(t==="total"){ let a,b,g=0; do{ a=pick(cat); b=pick(cat); }while(a.p+b.p>max && g++<50); if(a.p+b.p>max){ a=cat[4]; b=cat[1]; }
    q={t, items:[a,b], ans:a.p+b.p, en:`The customer wants ${a.en} and ${b.en}. How much altogether?`, ar:`الزبون عايز ${a.ar} و${b.ar}. كام الحساب كله؟`}; }
  else { const pay=max, a=pick(cat.filter(x=>x.p<pay));
    q={t, items:[a], pay, ans:pay-a.p, en:`${a.en} costs ${a.p}. The customer pays ${pay}. How much change?`, ar:`${a.ar} بـ${a.p}. الزبون دفع ${pay}. نرجعله كام باقي؟`}; }
  q.ch=numChoices(q.ans,0,max); C.q=q; C.tried=false;
}

function cashAnswer(v, t){
  const C=BZ.c, ok=+v===C.q.ans;

  if(!ok){ t.classList.add("wrong"); t.disabled=true; sfx.no(); cheer(C.q.t==="change"?"Count up from the price to what they paid! Try again 💫  عدّي من التمن لحد اللي دفعه":"Add the two prices. Try again 💫  اجمعي التمنين",true); return; }

}

      :`<p class="hint" style="margin:0">No projects waiting. · مفيش مشاريع مستنية.</p>`}
    <div class="bzpend" style="border-color:var(--mint)"><b>🗓️ Today: school ${dayRec().school?"✅":"⏳"} · business ${dayRec().biz?"✅":"⏳"} · play ${dayRec().play?"✅":"⏳"}</b>
      <span dir="rtl" lang="ar">المدرسة الأول، وبعدين البيزنس. أقل نسبة للمدرسة من وقت اللعب:</span>
      <div class="row" style="justify-content:flex-start">${[[.3,"30%"],[.5,"50%"],[.7,"70%"]].map(([x,l])=>`<button class="btn sm ${(B.share??.5)===x?"":"alt"}" data-bz="pshare" data-v="${x}">${l}</button>`).join("")}
      <button class="btn sm alt" data-bz="pgate">${B.gate===false?"🔓 School-first is OFF · شغّل":"🔒 School-first is ON · اقفل"}</button></div></div>
    <details><summary style="cursor:pointer;font-weight:800">Tracks and stages · المسارات والمراحل</summary><div style="display:grid;gap:6px;margin-top:8px">
      ${TRACKS.map(T=>{ const s=trackState(T), sg=stageOf(T.id); return `<div class="bzprow"><span>${T.e} ${T.en}${T.soon?" (soon)":` · ${s.done}/${s.total}`}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm alt" data-bz="pstage" data-v="${T.id}:-1" aria-label="Lower stage">−</button><b>${STAGES[sg-1][0]} ${sg}</b><button class="btn sm alt" data-bz="pstage" data-v="${T.id}:1" aria-label="Raise stage">+</button></span></div>`; }).join("")}</div></details>
    <button class="btn sm ${B.open.coffee?"alt":""}" style="align-self:flex-start" data-bz="popen" data-v="coffee">${B.open.coffee?"☕ Coffee-beans shop is OPEN · tap to close (متجر البن مفتوح)":"☕ Open the coffee-beans shop now · افتح متجر البن"}</button>
    <details><summary style="cursor:pointer;font-weight:800">Gallery (${B.gallery.length}) · المعرض</summary><div class="bzgal" style="margin-top:8px">${B.gallery.slice().reverse().map(p=>`<div style="position:relative">${bizPost(p,true)}<button class="btn sm danger" style="position:absolute;top:4px;right:4px;padding:4px 10px" data-bz="pdel" data-v="${p.id}" aria-label="Delete post">✕</button></div>`).join("")||`<span class="hint">No posts yet.</span>`}</div></details>
    <details><summary style="cursor:pointer;font-weight:800">Smart helper log (${B.helper.log.length}) · سجل المساعد</summary><div style="max-height:220px;overflow:auto;margin-top:8px;display:grid;gap:6px">${B.helper.log.slice(-30).reverse().map(x=>`<div style="padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.07)"><small>${new Date(x.t).toLocaleString()}</small><div>${esc(x.q)} → <b>${esc(x.a)}</b>${x.ok===0?" ❌":x.ok?" ✅":""}</div></div>`).join("")||`<span class="hint">Nothing yet.</span>`}</div></details>
  </div>`;
}

/* ---------------- Events ---------------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.nv && novaClick(d)) return;
  if(d.bz && bizClick(d,t)) return;
  if(d.go){ FROM_BIZ = false; if(d.go==="biz") BZ={screen:"map"}; if(["dress","base","explore"].includes(d.go)) markDay("play"); }
  if((d.sg||d.ls) && view.name==="biz") FROM_BIZ = true;
  if((d.sg||d.sx||d.drag||d.ls) && shopClick(t,d)) return;
  if(d.go){ sfx.tap(); return go({name:d.go, subject:view.subject||"math"}); }
  if(d.subject){ sfx.tap(); const s=SUBJECTS.find(x=>x.id===d.subject); if(s.soon) speak(`${s.name} is coming soon!`); return go({name:"home", subject:d.subject}); }
  if(d.unit){ sfx.tap(); return go({name:"unit", unit:d.unit, subject:"math"}); }
  if(d.skill){ sfx.tap(); return startGame(d.skill); }
  if(d.lesson){ sfx.tap(); return startGame(null, d.lesson); }
  if(d.mode){ sfx.tap(); return startMode(d.mode); }
  if(d.chal){ sfx.tap(); return startChallenge(+d.chal); }
  if(d.lessondel){ const l=S.school.find(x=>x.id===d.lessondel); if(l?.photo?.local) try{localStorage.removeItem(l.photo.local);}catch(e){} S.school=S.school.filter(x=>x.id!==d.lessondel); save(); return render(); }
  if(d.key!==undefined) return typeKey(d.key);
  if(d.sort!==undefined) return sortTap(+d.sort, t);
  if(d.choice!==undefined){ const c=game.q.choices[+d.choice]; return answer(+d.choice, t); }
  if(d.pin) return pinKey(d.pin);
  if(d.bitem){ const [id,costS]=d.bitem.split("|"), cost=+costS, B=S.base;
    if(cost>0 && !B.owned[id]){ if(wallet()<cost){ sfx.no(); speak(`You need ${cost-wallet()} more stars for that!`); return toast(`Need ${cost-wallet()} more ★`); } S.spent+=cost; B.owned[id]=true; sfx.win(); speak("Ta-da!"); } else sfx.tap();
    B.sel=id; save(); return render(); }
  if(d.bcat){ S.base.cat=d.bcat; sfx.tap(); save(); return render(); }
  if(d.bwall){ curRoom().wall=d.bwall; sfx.tap(); save(); return render(); }
  if(d.bfloor){ curRoom().floor=d.bfloor; sfx.tap(); save(); return render(); }
  if(d.broom!==undefined){ const k=+d.broom; if(S.stars<ROOM_AT[k]){ sfx.no(); speak("Collect more stars to open this room!"); return toast(`Earn ${ROOM_AT[k]-S.stars} more ★ to open this room`); } S.base.cur=k; sfx.tap(); save(); return render(); }
  if(d.wear){ const [slot,val,costS]=d.wear.split("|"); const cost=+costS; const key=slot+":"+val;
    if(cost>0 && !S.owned[key]){ if(wallet()<cost){ sfx.no(); speak(`You need ${cost-wallet()} more stars for that!`); return toast(`Need ${cost-wallet()} more ★`); } S.spent+=cost; S.owned[key]=true; sfx.win(); speak("Ta-da!"); }
    else sfx.tap();
    S.avatar[slot]=val; save(); return render(); }
  if(d.hwdone){ const h=S.homework.find(x=>x.id===d.hwdone); if(h&&!h.done){ h.done=true; h.doneAt=Date.now(); const ns=addStars(h.stars); S.cheers.push(`Mama gave you ${h.stars} stars for your homework!${ns.length?" New sticker: "+ns.join(" "):""}`); save(); toast(`Gave ${h.stars} stars`); render(); } return; }
  if(d.hwdel){ const h=S.homework.find(x=>x.id===d.hwdel); if(h?.photo?.local) try{localStorage.removeItem(h.photo.local);}catch(e){} if(h?.photo?.asset && ASSETS) ASSETS.delete(h.photo.asset).catch(()=>{}); S.homework=S.homework.filter(x=>x.id!==d.hwdel); save(); return render(); }
  switch(d.act){
    case "setup": { const n=$("#setupName").value.trim(); if(!n) return toast("Type a name first"); S.child.name=n; save(); go({name:"home",subject:"math"}); speak(`Welcome to Star Academy, ${n}!`); break; }
    case "say": speak(game.q.say,true); break;
    case "novaclear": S.chat.log=[]; save(); render(); break;
    case "quit": go(game&&game.mode==="explore" ? {name:"explore"} : game&&(game.lesson||game.mode) ?{name:"home",subject:"math"} : {name:"unit", unit:view.unit}); break;
    case "addlesson": addLesson(); break;
    case "copyreport": { const t=reportText(), ta=$("#reportTxt"); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("Report copied")).catch(()=>{ ta.focus(); ta.select(); toast("Select the text and copy it"); }); break; }
    case "rmphoto": delete S.child.photo; save(); render(); break;
    case "cheerok": S.cheers.shift(); sfx.win(); save(); render(); break;
    case "lock": go({name:"home",subject:"math"}); break;
    case "hwadd": addHomework(); break;
    case "extra": S.extra = {date:today(), min:(S.extra.date===today()?S.extra.min:0)+15}; save(); toast("Added 15 minutes for today"); render(); break;
    case "savename": { const n=$("#nameIn").value.trim(); if(n){ S.child.name=n; save(); toast("Name saved"); render(); } break; }
    case "changepin": pinBuf=""; pinStage="create"; go({name:"pin"}); break;
    case "reset": S._confirmReset=true; render(); break;
    case "resetno": S._confirmReset=false; render(); break;
    case "resetyes": { const keep={pin:S.pin, child:S.child, limitMin:S.limitMin, sound:S.sound, autoVoice:S.autoVoice, timer:S.timer, tspeed:S.tspeed}; S.homework.forEach(h=>{ if(h.photo?.local) try{localStorage.removeItem(h.photo.local);}catch(e){} }); S=Object.assign(fresh(),keep); save(); toast("Progress cleared"); render(); break; }
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="novaIn"){ const v=e.target.value; e.target.value=""; novaSend(v); } });
document.addEventListener("input", e=>{
  if(e.target.id==="limit"){ S.limitMin=+e.target.value; $("#limVal").textContent = S.limitMin===0?"No limit":S.limitMin+" min"; save(); }
  if(e.target.id==="novaOn"){ S.chat.on=e.target.checked; save(); render(); }
  if(e.target.id==="novaDaily"){ S.chat.daily=+e.target.value; save(); }
  if(e.target.id==="novaAi"){ S.chat.ai=e.target.checked; save(); }
  if(e.target.id==="novaAr"){ S.chat.ar=e.target.checked; save(); }
  if(e.target.dataset && e.target.dataset.nvt){ S.chat.topics[e.target.dataset.nvt]=e.target.checked?1:0; save(); }
  if(e.target.id==="autoVoiceIn"){ S.autoVoice=e.target.checked; save(); }
  if(e.target.id==="timerIn"){ S.timer=e.target.checked; save(); }
  if(e.target.id==="tspeedIn"){ S.tspeed=+e.target.value; save(); }
  if(e.target.id==="soundIn"){ S.sound=e.target.checked; save(); renderDock(); }
});
document.addEventListener("change", async e=>{
  if(e.target.id==="childPhoto" && e.target.files[0]){ try{ S.child.photo = await squarePhoto(e.target.files[0],240); save(); toast("Photo saved"); render(); }catch(err){ toast("Couldn't read that photo"); } }
});
$("#soundBtn").addEventListener("click", ()=>{ S.sound=!S.sound; if(!S.sound) try{speechSynthesis.cancel();}catch(e){} save(); renderDock(); if(view.name==="parent") render(); if(S.sound) speak("Sound is on",true); });
$("#parentBtn").addEventListener("click", openParent);
$("#meBtn").addEventListener("click", ()=>{ if(S.child.name) go({name:"dress"}); });

/* ---------------- Starfield ---------------- */
(function(){ const c=$("#sky"), x=c.getContext("2d"); let W,H,stars=[]; const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6*devicePixelRatio+.3,p:Math.random()*6.28,s:.5+Math.random()*1.5})); }
  function draw(t){ x.clearRect(0,0,W,H); for(const s of stars){ const a = still?.8:.45+.55*Math.abs(Math.sin(s.p+t/1000*s.s)); x.globalAlpha=a; x.fillStyle="#fff"; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); } if(!still) requestAnimationFrame(draw); }
  addEventListener("resize",()=>{size(); if(still) draw(0);}); size(); requestAnimationFrame(draw);
})();

render();
initCloud();
</script>
