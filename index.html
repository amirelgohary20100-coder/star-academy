<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a2e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>html{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);margin:0}body{margin:0}/* v16 */
.ojsheet,.beansheet{max-width:780px}
.ojroad{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;padding-bottom:26px}
.ojstep{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid var(--line);opacity:.6;font-size:.85rem;text-align:center}
.ojstep span{font-size:1.5rem}.ojstep small{font-size:.75rem}.ojstep.done{opacity:1;border-color:var(--mint)}.ojstep.now{opacity:1;border-color:var(--star);background:rgba(255,212,71,.15)}
.ojtruck{position:absolute;bottom:0;left:calc(var(--p)*(100% - 30px));font-style:normal;font-size:1.5rem;transition:left .8s ease}
@media (prefers-reduced-motion: reduce){.ojtruck{transition:none}}
.ojline{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.ojslot{min-height:84px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;text-align:center;padding:4px}
.ojslot span{font-size:1.5rem}.ojslot.done{border-style:solid;border-color:var(--mint);background:rgba(94,242,200,.12)}
.ojmsg{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 14px;border-radius:18px 18px 18px 4px;background:#e9fff5;color:#123a2c}
.ojmsg .ar{color:inherit;opacity:.85}.ojsheet .hopts{width:100%}.ojsheet .hopts .tile{flex-direction:column;align-items:flex-start;gap:2px;width:100%}.ojsheet .hopts .tile .ar{color:#5a4a7a;margin:0}
.bzpend label{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.ojmsg.prob{background:#ffe6e1;color:#4a1a12}.ojmsg p{margin:2px 0;font-weight:800;font-size:1.1rem}.ojmsg small{opacity:.7}
.ojav{flex:none;width:40px;height:40px;border-radius:50%;background:#4f9dff;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.ojbox{width:100%;max-width:460px;padding:12px;border-radius:16px;background:#c8955f;color:#3b2410;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.ojin{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:64px;margin-top:8px;padding:8px;border-radius:12px;background:#f3d9b5}
.ojbag{font-size:2.2rem;padding:4px 6px;border-radius:12px;background:#fffaf0}
.ojbook{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.ojslotb{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;background:#e9fff5;color:#123a2c;border:3px solid transparent;font-size:1.1rem}
.ojslotb.taken{background:#e6e1f5;color:#5a5470}.ojslotb.wrong,.tile.wrong{border-color:var(--bad);animation:shake .35s}
.ojcard.wrong{background:#6a2a3a}
.bvis{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800}
.bvis>span{padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.08)}
.bcoins{display:inline-flex;flex-wrap:wrap;gap:2px;vertical-align:middle}.bcoins i{font-style:normal;font-size:1.3rem}.bcoins i.cost{filter:sepia(1) saturate(2) hue-rotate(-20deg) brightness(.7)}.bcoins i.gain{filter:drop-shadow(0 0 4px #ffd447)}
.bdefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%}
.bdefs>div{padding:12px;border-radius:18px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:2px}.bdefs p{margin:2px 0}
.bprice{display:flex;align-items:center;gap:14px}.btag{padding:10px 22px;border-radius:14px 30px 30px 14px;background:var(--bc);color:#fff;font-family:var(--display);font-size:2rem}
.tasklist{display:grid;gap:10px}.taskc.done{border-color:var(--mint)}.taskc.wait{border-color:var(--star)}
.bzpend input[type=text],.bzpend input[type=number]{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)}
@media (max-width:700px){.ojroad,.ojline{grid-template-columns:repeat(3,1fr)}.ojroad{padding-bottom:0}.ojtruck{display:none}}

.dayplan{display:grid;gap:8px;padding:16px;border-radius:24px;background:linear-gradient(160deg,#1f7a5c,#16523f);border:1px solid var(--line);margin:0 0 18px}
.dayrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.22);border:2px solid var(--line)}
.dayrow.done{border-color:var(--mint);opacity:.85}.dayrow.locked{opacity:.55}
.dayrow .ar{display:block}
.dayn{width:38px;height:38px;border-radius:50%;background:var(--star);color:#2a1a00;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.dayrow.done .dayn{background:none}
.cashitems{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cashit{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 16px;border-radius:20px;background:#fffaf0;color:#2a1a4a;min-width:120px}
.cashit span{font-size:2.6rem}.cashit em{font-style:normal;font-weight:800;font-size:1.4rem;color:#b06a00}.cashit.pay{background:#e9fff5}
.cashans{font-size:2rem;min-width:90px;justify-content:center}
.site{display:grid;gap:8px;background:#fffaf0;border-radius:16px;padding:8px;color:#2a1a4a;min-height:200px}
.sb-h{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem}
.sb-h span{width:34px;height:34px;border-radius:50%;background:#fffaf0;display:grid;place-items:center}
.sb-p{border-radius:12px;overflow:hidden;aspect-ratio:4/3;cursor:pointer}.sb-p svg{width:100%;height:100%;display:block}
.sb-a{margin:0;font-weight:800;text-align:center}
.sb-l{margin:0;padding:0;list-style:none;display:grid;gap:4px}.sb-l li{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:#f1e6d4}
.sb-b{padding:12px;border-radius:99px;text-align:center;color:#fff;font-weight:800}
.code{display:grid;gap:2px;padding:10px;border-radius:14px;background:#0b0820;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;max-height:340px;overflow:auto}
.cl{all:unset;display:block;padding:3px 8px;border-radius:6px;color:#9fe8ff;white-space:pre-wrap;word-break:break-all;cursor:pointer}
.cl.hot{background:#ffd44733;color:#ffe58a}.cl.no{background:#ff8a7a33;color:#ffb3a7}
.bzsub{position:absolute;left:10%;right:10%;text-align:center;font-weight:800;font-size:clamp(.8rem,3.4vw,1.1rem);background:rgba(255,255,255,.85);color:#2a1a4a;border-radius:99px;padding:2px 8px}
.bzsub.top{top:14%}.bzsub.bottom{bottom:14%}.bzpost.small .bzsub{font-size:.55rem}
/* My Business (v12) */
.bizworld{height:max(320px,calc(100vh - 290px))}
.bzspots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.bzspots .tile,.tile small.ar,.tile small{display:inline-flex}
.tile small.ar{display:block;font-size:.85rem;font-weight:700;opacity:.85;width:100%}
.tile.sm{flex-wrap:wrap;font-size:1.15rem;min-height:54px;padding:8px 14px}
.bzorb{display:grid!important;place-items:center;font-size:2.4rem;background:radial-gradient(circle at 35% 30%,#fff8,#ff9f43 45%)}
.bztrack .lvl{align-self:flex-start}
.bzbar{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.bzbar i{display:block;height:100%;background:var(--mint)}
.bzhero{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:18px;align-items:center;padding:18px;border-radius:26px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);margin:8px 0 6px}
.bzsign{aspect-ratio:1;border-radius:22px;background:var(--bc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);font-family:var(--display);font-size:1.3rem;text-align:center;padding:10px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.bzlogo{font-size:3.4rem;width:86px;height:86px;border-radius:50%;background:#fffaf0;display:grid;place-items:center;text-shadow:none}
.bzown{display:inline-flex;gap:6px;align-items:center}.bzown input{max-width:200px}
.bzstages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 14px}
.bzstage{padding:8px 4px;border-radius:16px;background:var(--panel);border:2px solid var(--line);text-align:center;display:flex;flex-direction:column;opacity:.6}
.bzstage span{font-size:1.6rem}.bzstage b{font-size:.9rem}.bzstage small{font-size:.8rem;color:var(--muted)}
.bzstage.now{opacity:1;border-color:var(--star)}.bzstage.done{opacity:1;border-color:var(--mint)}
.bzitems{display:grid;gap:10px;margin-bottom:14px}
.bzitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 16px;border-radius:20px;background:var(--panel2);border:2px solid var(--line)}
.bzitem.done{border-color:var(--mint)}.bzitem.locked{opacity:.6}
.bzie{font-size:2rem}.bzcheck{font-size:1.4rem}
.bzitem .ar,.bzproj .ar,.card .ar{display:block}
.bzproj.ready{border:3px solid var(--star)}
.studio{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:18px;align-items:start}
.studiopv{position:sticky;top:8px;display:grid;gap:8px}
.studioctl{display:grid;gap:12px;min-width:0}
.bzpost{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.bzpost.story{aspect-ratio:9/16;max-width:300px;margin:0 auto}
.bzph{position:absolute;inset:12% 7% 12% 7%;border-radius:12px;overflow:hidden}.bzpost.story .bzph{inset:18% 7% 18% 7%}
.bzph svg{width:100%;height:100%;display:block}
.bzempty{width:100%;height:100%;display:grid;place-items:center;font-size:3rem;background:rgba(0,0,0,.08)}
.bztx{position:absolute;left:6%;right:6%;text-align:center;font-weight:800;font-size:clamp(1rem,4.6vw,1.7rem);line-height:1.1}
.bztx.top{top:1.5%}.bztx.bottom{bottom:1.5%}
.bzpost.story .bztx.top{top:5%}.bzpost.story .bztx.bottom{bottom:5%}
.bzbadge{position:absolute;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 3px;border-radius:99px;color:#fff;font-size:.8rem;font-weight:800;max-width:62%}
.bzbadge span{width:26px;height:26px;border-radius:50%;background:#fffaf0;display:grid;place-items:center;font-size:1rem;flex:none}
.bzbadge b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bzbadge.tl{top:2%;left:2%}.bzbadge.tr{top:2%;right:2%}.bzbadge.bl{bottom:2%;left:2%}.bzbadge.br{bottom:2%;right:2%}
.bzst{position:absolute;font-style:normal;font-size:1.8rem}.bzst.s0{top:16%;right:9%}.bzst.s1{bottom:16%;left:9%}.bzst.s2{top:46%;left:4%}
.bzpost.small .bztx{font-size:.75rem}.bzpost.small .bzbadge{font-size:.55rem;padding:2px 6px 2px 2px}.bzpost.small .bzbadge span{width:16px;height:16px;font-size:.6rem}.bzpost.small .bzst{font-size:1rem}
.bzthumb{width:110px;height:110px;border-radius:16px;overflow:hidden;border:4px solid var(--line);padding:0;background:none}.bzthumb[aria-pressed="true"]{border-color:var(--star)}.bzthumb svg{width:100%;height:100%;display:block}
.bzgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bzgi{padding:0;background:none;border:0}
.hopts{display:grid;gap:8px;margin-top:6px}.hopts .tile{justify-content:flex-start;text-align:left;background:#fffaf0;color:#2a1a4a}
.hreq{padding:10px 14px;border-radius:16px;background:#4f9dff;color:#fff;font-weight:800;font-size:1.1rem}
.bzpend{display:grid;gap:6px;padding:12px;border-radius:16px;border:2px solid var(--star)}
.bzprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
@media (max-width:700px){.bzhero{grid-template-columns:1fr}.bzsign{max-width:200px;margin:0 auto;width:100%}.studio{grid-template-columns:1fr}.studiopv{position:static;max-width:340px;margin:0 auto;width:100%}.bzstage b{font-size:.75rem}.bzstage small{display:none}.bzthumb{width:86px;height:86px}}
</style>
<title>Star Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one deep-space screen; a top dock (avatar, stars, sound, grown-ups) over a scrolling stage that swaps views. Single dark look by choice. */
:root{
  --space:#0f0a2e; --space2:#1d1457; --panel:#2a1d6e; --panel2:#3b2a9a;
  --ink:#f6f3ff; --muted:#bdb6ee; --star:#ffd447; --pink:#ff7ac6; --mint:#5ef2c8; --sky:#6cc8ff; --bad:#ff8a7a;
  --line:rgba(255,255,255,.14);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:18px;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 20% 10%,#3a2380 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,#123a6e 0%,transparent 50%),var(--space)}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.dock{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me .av{width:56px;height:56px;border-radius:50%;background:var(--panel);overflow:hidden;flex:none;border:2px solid var(--line)}
.me b{font-family:var(--display);font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.iconbtn{width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:1.5rem}
.iconbtn.off{background:#3a2140}
.stage{flex:1;padding-block:8px 32px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:12px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:1.25rem;font-weight:700}
.tab[aria-current="true"]{background:var(--star);color:#2a1a00;border-color:transparent}
.badge{display:inline-block;min-width:24px;padding:0 6px;border-radius:12px;background:var(--pink);color:#2b0420;font-size:.9rem;margin-left:6px}
.hello{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.hello h1{font-size:clamp(2rem,5vw,3rem)}
.hello p{margin:4px 0 0;color:var(--muted);font-size:1.15rem}
.subjects{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.subj{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800}
.subj .dot{width:34px;height:34px;border-radius:50%}
.subj[aria-current="true"]{border:2px solid var(--star)}
.subj.soon{opacity:.55}
.subj small{font-weight:700;color:var(--muted)}
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.planet{position:relative;text-align:left;padding:18px;border-radius:28px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:190px}
.planet .orb{width:84px;height:84px;border-radius:50%;box-shadow:inset -14px -10px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.12)}
.planet .ring{position:absolute;left:4px;top:52px;width:126px;height:24px;border:4px solid rgba(255,255,255,.35);border-radius:50%;transform:rotate(-14deg);pointer-events:none}
.planet h3{font-size:1.45rem}
.planet .u{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stars3{color:var(--star);font-size:1.1rem;letter-spacing:2px}
.stars3 .e{color:rgba(255,255,255,.22)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.mission{text-align:left;padding:20px;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mission h3{font-size:1.4rem}
.mission p{margin:0;color:var(--muted)}
.lvl{display:flex;gap:6px}
.lvl i{width:28px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
.lvl i.on{background:var(--mint)}
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.2rem;font-weight:700;padding:10px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:16px}
/* game */
.game{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:8px;margin-left:auto}
.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.ok{background:var(--star)}.dots i.miss{background:var(--bad)}.dots i.now{outline:3px solid var(--mint)}
.q{display:flex;align-items:center;gap:14px}
.q h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.say{flex:none;width:56px;height:56px;border-radius:50%;background:var(--mint);color:#04261d;font-size:1.6rem;display:grid;place-items:center}
.visual{min-height:140px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:22px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;font-size:2.6rem;text-align:center}
.vgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.vrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.op{font-family:var(--display);font-size:3.4rem;color:var(--star);padding:0 8px}
.crossed{opacity:.35;position:relative}
.crossed::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:5px;background:var(--bad);transform:rotate(-30deg);border-radius:3px}
.numbox{min-width:76px;height:76px;padding:0 10px;border-radius:18px;background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;font-weight:800}
.numbox.q{background:var(--star);color:#2a1a00}
.big{font-family:var(--display);font-size:4rem;font-weight:800}
.frame{display:grid;grid-template-columns:repeat(5,52px);gap:6px;padding:8px;border-radius:14px;background:rgba(0,0,0,.25)}
.frame i{height:52px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-size:2rem}
.rod{display:flex;flex-direction:column;gap:2px;padding:3px;background:#2e8bd6;border-radius:6px}
.rod i,.cube{width:22px;height:22px;background:var(--sky);border-radius:4px;display:block}
.cube{background:var(--mint)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.choice{min-height:96px;border-radius:24px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-size:2.6rem;font-weight:800;display:grid;place-items:center;padding:10px;transition:transform .12s}
.choice:active{transform:scale(.96)}
.choice.right{background:#1f7a5c;border-color:var(--mint)}
.choice.wrong{background:#6a2a3a;border-color:var(--bad);animation:shake .35s}
.choice.small{font-size:1.4rem}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* stickers & wardrobe */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}

.items{display:flex;gap:10px;flex-wrap:wrap}
.item{min-width:92px;padding:10px 12px;border-radius:18px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.95rem}

/* homework */
.hwlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

.hw h3{font-size:1.3rem}
.hw .meta{color:var(--muted);font-size:.95rem}
.done{color:var(--mint);font-weight:800}
.empty{padding:28px;border-radius:24px;border:2px dashed var(--line);color:var(--muted);text-align:center}
/* parent */
.parent{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px;font-size:16px;user-select:text;-webkit-user-select:text}
.card{border-radius:22px;background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
label{font-weight:800;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number],input[type=date],select{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--space2);color:var(--ink);width:100%;box-sizing:border-box}

.tbl{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;min-width:60px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:#04261d;font-weight:800;padding:12px 20px;border-radius:16px;z-index:20;max-width:90vw}

/* My Star Home */

  .choice{min-height:104px}

}

const VERSION = 1;
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ---------------- Subject packs ---------------- */
const SUBJECTS = [
  /* Units follow the Primary 1 Mathematics Term 1 book (Ministry of Education), chapter by chapter */
  { id:"math", name:"Math", color:"#ffd447", units:[
    { id:"u1", page:6,  title:"Numbers up to 10", color:"#ff9f43", skills:["count10","numword","bond","compare","zero","nextnum"] },
    { id:"u2", page:32, title:"What's the Position?", color:"#5ef2c8", skills:["position"] },
    { id:"u3", page:36, title:"Addition", color:"#ff7ac6", skills:["addpic","add10","addstory"] },
    { id:"u4", page:44, title:"Subtraction", color:"#6cc8ff", skills:["subpic","sub10","substory"] },
    { id:"u5", page:54, title:"Comparing Lengths", color:"#b48cff", skills:["length"] },
    { id:"u6", page:60, title:"Representing Data", color:"#7be37b", skills:["data"] },
    { id:"u7", page:72, title:"Numbers Greater than 10", color:"#ffb3a7", skills:["count20","tenplus","numline","order","addsub20","tens"] },
    { id:"u8", page:86, title:"Reading the Clock", color:"#ffd447", skills:["clock"] },
    { id:"u9", page:88, title:"Operations with 3 Numbers", color:"#ff9fd8", skills:["add3"] },
  ]},
  { id:"shop", name:"Star Shop 🏪", color:"#ff9f43", units:[] },
  { id:"english", name:"English", color:"#ff7ac6", soon:true, units:[] },
  { id:"arabic", name:"Arabic", color:"#5ef2c8", soon:true, units:[] },
  { id:"science", name:"Science", color:"#6cc8ff", soon:true, units:[] },
  { id:"german", name:"German", color:"#b48cff", soon:true, units:[] },

const SKILLS = {

  nextnum:{name:"What comes next?", blurb:"Numbers in order"},
  add10:{name:"Rocket adding", blurb:"Add up to 10"},
  make10:{name:"Make 10", blurb:"Number bonds"},

const THINGS = [
  {e:"⭐",one:"star",many:"stars"},{e:"🚀",one:"rocket",many:"rockets"},{e:"🪐",one:"planet",many:"planets"},
  {e:"🌙",one:"moon",many:"moons"},{e:"👽",one:"alien",many:"aliens"},{e:"☄️",one:"comet",many:"comets"},
];
const TH_THINGS = {

  jungle:[{e:"🐒",one:"monkey",many:"monkeys"},{e:"🦜",one:"parrot",many:"parrots"},{e:"🐘",one:"elephant",many:"elephants"},{e:"🦁",one:"lion",many:"lions"},{e:"🐸",one:"frog",many:"frogs"},{e:"🦋",one:"butterfly",many:"butterflies"}],
  candy:[{e:"🍭",one:"lollipop",many:"lollipops"},{e:"🍩",one:"donut",many:"donuts"},{e:"🧁",one:"cupcake",many:"cupcakes"},{e:"🍓",one:"strawberry",many:"strawberries"},{e:"🍪",one:"cookie",many:"cookies"},{e:"🍬",one:"candy",many:"candies"}],
  dino:[{e:"🦖",one:"dino",many:"dinos"},{e:"🥚",one:"egg",many:"eggs"},{e:"🦕",one:"long-neck",many:"long-necks"},{e:"🌋",one:"volcano",many:"volcanoes"},{e:"🌿",one:"leaf",many:"leaves"},{e:"🦴",one:"bone",many:"bones"}],
  snow:[{e:"⛄",one:"snowman",many:"snowmen"},{e:"❄️",one:"snowflake",many:"snowflakes"},{e:"🐧",one:"penguin",many:"penguins"},{e:"🧊",one:"ice cube",many:"ice cubes"},{e:"🦭",one:"seal",many:"seals"},{e:"🧤",one:"mitten",many:"mittens"}],
  farm:[{e:"🐄",one:"cow",many:"cows"},{e:"🐔",one:"chicken",many:"chickens"},{e:"🐷",one:"pig",many:"pigs"},{e:"🌽",one:"corn",many:"corns"},{e:"🍎",one:"apple",many:"apples"},{e:"🥕",one:"carrot",many:"carrots"}],
  robot:[{e:"🤖",one:"robot",many:"robots"},{e:"⚙️",one:"gear",many:"gears"},{e:"🔋",one:"battery",many:"batteries"},{e:"💡",one:"bulb",many:"bulbs"},{e:"🛰️",one:"satellite",many:"satellites"},{e:"🎮",one:"game",many:"games"}],
  garden:[{e:"🦄",one:"unicorn",many:"unicorns"},{e:"🧚",one:"fairy",many:"fairies"},{e:"🌸",one:"flower",many:"flowers"},{e:"🌈",one:"rainbow",many:"rainbows"},{e:"🍄",one:"mushroom",many:"mushrooms"},{e:"🐝",one:"bee",many:"bees"}],
  city:[{e:"🚗",one:"car",many:"cars"},{e:"🚒",one:"fire truck",many:"fire trucks"},{e:"🚁",one:"helicopter",many:"helicopters"},{e:"🚲",one:"bike",many:"bikes"},{e:"🚂",one:"train",many:"trains"},{e:"🚌",one:"bus",many:"buses"}],
};
const THEMES = [
  {id:"galaxy",icon:"🌌",tag:"Galaxy Mission",bg:"linear-gradient(160deg,#2a1d6e,#150f45)",p2:"#3b2a9a",line:"rgba(255,255,255,.14)",cr:"24px",deco:["⭐","🌙","✨","🪐"],praise:["Super!","Stellar!","Out of this world!"],things:THINGS},
  {id:"ocean",icon:"🌊",tag:"Ocean Rescue",bg:"linear-gradient(170deg,#0b78b5,#063a66)",p2:"#1b8fd0",line:"rgba(160,240,255,.4)",cr:"50px",deco:["🫧","🐟","🐚","🌊"],praise:["Splash! Great!","Wave-some!","Fin-tastic!"],things:TH_THINGS.ocean},
  {id:"jungle",icon:"🌴",tag:"Jungle Trek",bg:"linear-gradient(170deg,#2f9a55,#124a2a)",p2:"#3bb066",line:"rgba(210,255,200,.35)",cr:"18px 42px",deco:["🌿","🦜","🍃","🌴"],praise:["Roar-some!","Swing high!","Jungle genius!"],things:TH_THINGS.jungle},
  {id:"candy",icon:"🍭",tag:"Candy Land",bg:"linear-gradient(165deg,#e0629f,#7a2d8f)",p2:"#c4489a",line:"rgba(255,220,240,.4)",cr:"36px",deco:["🍬","🍭","🍩","🧁"],praise:["Sweet!","Yummy!","Sugar-star!"],things:TH_THINGS.candy},
  {id:"dino",icon:"🦖",tag:"Dino Dig",bg:"linear-gradient(165deg,#b86a1f,#5a2d0c)",p2:"#d68a30",line:"rgba(255,225,170,.4)",cr:"10px",deco:["🦴","🌋","🦕","🌿"],praise:["Rawr! Great!","Dino-mite!","Stomp-tastic!"],things:TH_THINGS.dino},
  {id:"snow",icon:"❄️",tag:"Snow Day",bg:"linear-gradient(170deg,#5aa7d8,#1d3f78)",p2:"#4b8fd2",line:"rgba(255,255,255,.45)",cr:"30px 8px",deco:["❄️","⛄","🧊","❄️"],praise:["Cool!","Ice work!","Snow-perb!"],things:TH_THINGS.snow},
  {id:"farm",icon:"🚜",tag:"Happy Farm",bg:"linear-gradient(170deg,#b28a2a,#5c4414)",p2:"#d1983a",line:"rgba(255,240,190,.4)",cr:"22px",deco:["🌽","🐔","🍎","🌾"],praise:["Moo-velous!","Farm-tastic!","Egg-cellent!"],things:TH_THINGS.farm},
  {id:"robot",icon:"🤖",tag:"Robot Lab",bg:"linear-gradient(160deg,#2f3947,#0d1017)",p2:"#334155",line:"rgba(94,242,200,.5)",cr:"6px",deco:["⚙️","🔋","💡","🛰️"],praise:["Beep boop! Correct!","Systems great!","Power up!"],things:TH_THINGS.robot},
  {id:"garden",icon:"🧚",tag:"Fairy Garden",bg:"linear-gradient(165deg,#b583e8,#5f2d98)",p2:"#8a54c9",line:"rgba(255,230,255,.4)",cr:"28px 28px 28px 6px",deco:["🌸","🦋","✨","🌈"],praise:["Magical!","Sparkle!","Bloom-tiful!"],things:TH_THINGS.garden},
  {id:"city",icon:"🏙️",tag:"Busy City",bg:"linear-gradient(170deg,#d9585f,#7a2146)",p2:"#c2485a",line:"rgba(255,225,225,.4)",cr:"14px",deco:["🚦","🚁","🚌","🏙️"],praise:["Beep beep! Yes!","Full speed!","Zoom!"],things:TH_THINGS.city},
];
let CUR_THINGS = THINGS;
const pickThing = () => pick(CUR_THINGS);
const thStyle = t => `style="--gbg:${t.bg};--panel2:${t.p2};--line:${t.line};--cr:${t.cr}"`;
const thDeco = t => t.deco.map((e,i)=>`<span class="deco d${i+1}" aria-hidden="true">${e}</span>`).join("");
const hashStr = x => [...String(x)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const themeObj = () => THEMES.find(t=>t.id===(typeof game!=="undefined"&&game&&game.theme)) || THEMES[0];
const SHAPES = {
  circle:c=>`<circle cx="50" cy="50" r="38" fill="${c}"/>`,
  square:c=>`<rect x="14" y="14" width="72" height="72" rx="4" fill="${c}"/>`,
  triangle:c=>`<polygon points="50,10 90,86 10,86" fill="${c}"/>`,
  rectangle:c=>`<rect x="6" y="26" width="88" height="48" rx="4" fill="${c}"/>`,
  oval:c=>`<ellipse cx="50" cy="50" rx="44" ry="28" fill="${c}"/>`,
  hexagon:c=>`<polygon points="28,12 72,12 94,50 72,88 28,88 6,50" fill="${c}"/>`,
};
const SIDES = {circle:0,square:4,triangle:3,rectangle:4,oval:0,hexagon:6};
const SHAPE_COLORS = ["#ffd447","#ff7ac6","#5ef2c8","#6cc8ff","#ff9f43","#b48cff"];
const shapeSVG = (s,c,size=110) => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${SHAPES[s](c)}</svg>`;
const icons = (n,e,crossFrom=Infinity) => `<div class="vgrid">${Array.from({length:n},(_,i)=>`<span class="${i>=crossFrom?"crossed":""}">${e}</span>`).join("")}</div>`;
function numChoices(ans,min,max,n=4){ const s=new Set([ans]); let guard=0; while(s.size<n && guard++<200){ const d=ans+rnd(-3,3); if(d>=min&&d<=max) s.add(d);} return shuffle([...s]).map(v=>({value:v,html:String(v)})); }
function tensRods(t,o){ return `<div class="vrow" style="align-items:flex-end;gap:10px">${Array.from({length:t},()=>`<span class="rod">${"<i></i>".repeat(10)}</span>`).join("")}<span class="vrow" style="gap:4px;max-width:140px">${"<i class='cube'></i>".repeat(o)}</span></div>`; }
function tenFrame(n,e="⭐"){ return `<div class="frame">${Array.from({length:10},(_,i)=>`<i>${i<n?e:""}</i>`).join("")}</div>`; }

/* Each generator returns {text, say, visual, choices:[{value,html,say?}], answer, small?} for level L (1..3). */
const GEN = {
  count10(L){ const t=pickThing(); const n=[[1,5],[3,8],[5,10]][L-1]; const a=rnd(...n);
    return {text:`How many ${t.many}?`, say:`How many ${t.many} can you count?`, visual:icons(a,t.e), choices:numChoices(a,1,10), answer:a}; },
  count20(L){ const t=pickThing(); const n=[[10,13],[11,16],[13,20]][L-1]; const a=rnd(...n);
    const vis = `<div style="display:flex;flex-direction:column;gap:8px">${tenFrame(10,t.e)}${tenFrame(a-10,t.e)}</div>`;
    return {text:`How many ${t.many}?`, say:`Count the ${t.many}. Ten, then keep counting!`, visual:vis, choices:numChoices(a,10,20), answer:a}; },
  nextnum(L){
    if(L===1){ const n=rnd(1,9); return {text:`What comes after ${n}?`, say:`What number comes after ${n}?`, visual:`<span class="numbox">${n}</span><span class="numbox q">?</span>`, choices:numChoices(n+1,1,10), answer:n+1}; }
    if(L===2){ const n=rnd(2,10); return {text:`What comes before ${n}?`, say:`What number comes before ${n}?`, visual:`<span class="numbox q">?</span><span class="numbox">${n}</span>`, choices:numChoices(n-1,1,10), answer:n-1}; }
    const s=rnd(1,16), miss=rnd(1,2); const seq=[s,s+1,s+2,s+3];
    return {text:"Which number is missing?", say:"Which number is missing?", visual:seq.map((v,i)=>`<span class="numbox ${i===miss?"q":""}">${i===miss?"?":v}</span>`).join(""), choices:numChoices(seq[miss],1,20), answer:seq[miss]}; },
  add10(L){ const max=[5,10,10][L-1]; const a=rnd(1,max-1), b=rnd(1,max-a); const t=pickThing();
    const vis = L<3 ? `${icons(a,t.e)}<span class="op">+</span>${icons(b,t.e)}` : `<span class="big">${a} + ${b} = ?</span>`;
    return {text:`${a} + ${b} = ?`, say:`What is ${a} plus ${b}?`, visual:vis, choices:numChoices(a+b,0,10), answer:a+b}; },
  sub10(L){ const max=[5,10,10][L-1]; const a=rnd(2,max), b=rnd(1,a-1); const t=pickThing();
    const vis = L<3 ? icons(a,t.e,a-b) : `<span class="big">${a} − ${b} = ?</span>`;
    return {text:`${a} − ${b} = ?`, say:`${a} ${t.many}, take away ${b}. How many are left?`, visual:vis, choices:numChoices(a-b,0,10), answer:a-b}; },
  make10(L){
    if(L===1){ const a=rnd(1,9); return {text:"How many more to make 10?", say:`There are ${a} stars. How many more make 10?`, visual:tenFrame(a), choices:numChoices(10-a,0,10), answer:10-a}; }
    const tot = L===2 ? 10 : rnd(5,9); const a=rnd(1,tot-1);
    return {text:`${a} and ? make ${tot}`, say:`${a} and what number make ${tot}?`, visual:`<span class="numbox">${a}</span><span class="op">+</span><span class="numbox q">?</span><span class="op">=</span><span class="numbox">${tot}</span>`, choices:numChoices(tot-a,0,10), answer:tot-a}; },
  shapes(L){
    const pool = L===1 ? ["circle","square","triangle","rectangle"] : ["circle","square","triangle","rectangle","oval","hexagon"];

    const counts = L===1 ? kinds.map(()=>rnd(1,6)) : shuffle([2,3,4,5,6,7,8]).slice(0,kinds.length);

    if(L===1){ const i=rnd(0,kinds.length-1);

    if(L===2){ const best = counts.indexOf(Math.max(...counts));
      return {text:"Which one is there most of?", say:"Which fruit is there the most of?", visual:jumble, choices:kinds.map(k=>({value:k,html:k})), answer:kinds[best]}; }
    const order = counts.map((c,i)=>i).sort((a,b)=>counts[b]-counts[a]); const i=order[0], j=order[rnd(1,order.length-1)];

    const pt=(a,r)=>{const t=(a-90)*Math.PI/180; return [100+r*Math.cos(t),100+r*Math.sin(t)];};
    const nums=Array.from({length:12},(_,i)=>{const [x,y]=pt((i+1)*30,76); return `<text x="${x.toFixed(1)}" y="${(y+6).toFixed(1)}" text-anchor="middle" font-size="18" font-weight="800" fill="#2a1a4a">${i+1}</text>`;}).join("");

    const nh = x => ((x-1+12)%12)+1; const lab=(hh,hf)=>hf?`half past ${hh}`:`${hh} o'clock`;

/* ---------- formats: build / kbd / match ---------- */
function lxBody(q){

const MATH_KEYS = [
  [/count|how many/i,"count10"],[/next|before|after|order|missing/i,"nextnum"],[/add|plus|sum|\+/i,"add10"],
  [/take away|subtract|minus|−/i,"sub10"],[/bond|make 10|make ten/i,"make10"],[/shape|circle|square|triangle|rectangle|oval|hexagon|side/i,"shapes"],
  [/compare|more|less|bigger|smaller|greater/i,"compare"],[/tens|ones|place value/i,"tens"],
  [/position|front|back|1st|2nd|3rd|ordinal|first|second|third/i,"position"],[/length|longer|shorter|longest|shortest/i,"length"],
  [/number words|spell|one two three/i,"numword"],[/zero/i,"zero"],[/makes? \d|number bond|what makes/i,"bond"],[/number line/i,"numline"],[/order|greatest|smallest/i,"order"],
  [/data|graph|tally|picture graph|sort/i,"data"],[/clock|o'clock|half past|time/i,"clock"],[/three numbers|3 numbers/i,"add3"],
];
function mathSkillsFrom(text){
  const set = new Set(); MATH_KEYS.forEach(([re,id])=>{ if(re.test(text)) set.add(id); });
  if(/\b(20|1[1-9]|twenty|teen)\b/i.test(text)){ if(set.has("count10")){set.delete("count10");set.add("count20");} if(set.has("add10")||set.has("sub10")){set.delete("add10");set.delete("sub10");set.add("addsub20");} }

}
async function aiCards(subject, topic, notes){

  const cards = (r && r.cards || []).filter(c=>c && typeof c.q==="string" && Array.isArray(c.choices) && c.choices.length>=2 && c.choices.map(String).includes(String(c.answer)))

  if(!cards.length) throw new Error("empty");

}
async function squarePhoto(file,size){

  const s=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=size;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size); URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg",.75);
}

function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); voice = vs.find(v=>/female|samantha|google uk english female|zira|libby|sonia/i.test(v.name)) || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs[0] || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(t,force){ if(!S.sound) return; if(!force && !S.autoVoice) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voice) u.voice=voice; u.lang=voice?.lang||"en-GB"; u.rate=.9; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function winSpeak(perfect, won, score, total, stars){ const n=S.child.name||"";
  if(perfect) speak(`Super duper, ${n}! You got all ${total} right. ${stars} stars for you!`,true);
  else if(won) speak(`Well done ${n}! You got ${score} out of ${total}. ${stars} ${stars===1?"star":"stars"}.`,true); }
function tone(freqs,dur=.12){ if(!S.sound) return; try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  freqs.forEach(f=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur); t+=dur*.8; }); }catch(e){} }
const sfx = { ok:()=>tone([660,880,1320]), no:()=>tone([300,220],.16), win:()=>tone([523,659,784,1047,1319],.14), tap:()=>tone([700],.05) };

function sk(id){ return S.skills[id] ||= {level:1, best:[0,0,0], correct:0, attempts:0, last:0}; }
function unitStars(u){ return u.skills.reduce((s,id)=>s+Math.max(...sk(id).best),0); }
function addStars(n, why){
  S.stars += n; S.starsToSticker += n; let newSt=[];
  while(S.starsToSticker >= STARS_PER_STICKER && S.stickers.length < STICKERS.length){
    S.starsToSticker -= STARS_PER_STICKER; const left = STICKERS.filter(s=>!S.stickers.includes(s)); const s = left[0]; S.stickers.push(s); newSt.push(s); }
  return newSt;
}

function nextQ(){ let q, guard=0; CUR_THINGS=(THEMES.find(t=>t.id===game.theme)||THEMES[0]).things;
  const mk = () => {
    if((game.mode==="mix"||game.mode==="chal") && (!game.subj||game.subj==="math") && Math.random()<.15) return sortQ(game.mode==="chal"?game.level:2);
    if(game.skill==="order" && !game.mode && !game.lesson && Math.random()<.3) return sortQ(game.level);
    if(game.lesson) return genLesson(game.lesson, game.level);
    if(game.mode){ const s = game.mode==="check" ? game.queue[game.i] : pick(game.pool); const lv = game.mode==="check" ? Math.max(sk(s).level, S.checks.length?1:2) : game.mode==="chal" ? Math.min(3,Math.max(sk(s).level,game.level)) : sk(s).level;
      const x = GEN[s](lv); x.skill=s; x.lv=lv; return x; }
    return GEN[game.skill](game.level);
  };
  do { q = mk(); } while(game.mode!=="check" && game.q && q.text===game.q.text && guard++<5);
  q=fmtQ(q); game.q=q; game.tried=false; game.locked=false; }

/* ---- timer ruler: shrinks while a question is open ---- */
let TM=null;
function timerStop(){ if(TM){ clearTimeout(TM.t); TM=null; } }
function paintBar(){ const i=document.querySelector("#tbar i"); if(!i||!TM) return; const el=(Date.now()-TM.start)/1000; i.style.animation=`tshrink ${TM.sec}s linear ${-el}s forwards, tcol ${TM.sec}s linear ${-el}s forwards`; }
function timerArm(key, sec, onEnd){
  if(TM && TM.key===key){ paintBar(); return; }
  timerStop(); const me={key, sec, start:Date.now()};
  me.t=setTimeout(()=>{ if(TM===me){ TM=null; onEnd(); } }, sec*1000); TM=me; paintBar();
}
const tmul = () => ({1.5:1.5,1:1,.75:.75}[S.tspeed]||1);
function qSeconds(q){
  const lv=q.lv||game.level||1;
  let s = game.mode==="chal" ? Math.max(10, 22-Math.floor(game.chal/3)) : ({1:26,2:20,3:15}[lv]||20);
  if(q.fmt==="typed") s+=8; if(q.fmt==="sort") s+=10+q.items.length*2; if(game.lesson) s+=15;
  if(q.fmt==="build") s+=8+q.target.length*3; if(q.fmt==="kbd") s+=12+[...q.word].length*3; if(q.fmt==="match") s+=8+q.pairs.length*5; s+=q.xs||0;
  return Math.max(8,Math.round(s*(S.tspeed||1)));
}
function shopSeconds(){ const t=SG.cur.t, base={pick:25,multi:35,tap:30,seq:40}[t]||30; return Math.max(15,Math.round(base*Math.max(.5,1-.04*((SG.lvl||1)-1))*(S.tspeed||1))); }
function syncTimer(){
  if(S.timer===false){ timerStop(); return; }
  if(view.name==="game" && game && game.q && !game.locked){ timerArm(game.q, qSeconds(game.q), mathTimeout); return; }
  if(view.name==="shop" && typeof SG!=="undefined" && SG && SG.cur && SG.step!=="done" && SG.g>=4 && ["pick","multi","tap","seq"].includes(SG.cur.t)){ timerArm(SG.cur, shopSeconds(), shopTimeout); return; }
  timerStop();
}
function shopTimeout(){
  if(!SG||SG.step==="done"||view.name!=="shop") return;
  SG.mist=true; sfx.no(); cheer("Time's up! ⏱️ Take your time and try again.", true); save();
  TM=null; setTimeout(()=>{ syncTimer(); },50);
}
function mathLog(right){
  const q=game.q, qs=q.skill||game.skill, k=sk(qs);
  if(!game.tried){ k.attempts++; if(right) k.correct++; game.results.push(right); (game.detail ||= []).push({s:qs,lv:q.lv||game.level,ok:right}); S.log.push({t:Date.now(),s:qs,l:q.lv||game.level,ok:right}); if(S.log.length>400) S.log=S.log.slice(-400); }
  game.tried=true;
}
function mathAdvance(){ game.i++; if(game.i>=(game.rounds||ROUND)) finishRound(); else { nextQ(); game.spoken=false; render(); } }
function mathTimeout(){
  if(!game||view.name!=="game"||game.locked) return;
  const q=game.q; mathLog(false); game.locked=true; sfx.no();
  if(q.fmt==="typed"){ const el=$("#typedv"); if(el){ el.textContent=q.answer; el.classList.add("right"); } }
  else if(q.fmt!=="sort" && q.choices){ const i=q.choices.findIndex(c=>c.value===q.answer); const b=document.querySelectorAll("[data-choice]")[i]; if(b) b.classList.add("right"); }
  const ch=$("#cheer"); if(ch){ ch.className="cheer no"; ch.textContent="Time's up! ⏱️ "+(q.reveal?"Answer: "+q.reveal+". ":"")+"Let's try the next one."; }
  save(); setTimeout(mathAdvance, 2300);
}
function judge(right, btn){

async function compressImage(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=1400, sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  return c;
}

const LESSON_ORDER=["platforms","search","ai","ads"];
function lsReset(){

  if(st.t==="match") LS.rorder=shuffle(st.pairs.map((x,i)=>i));
  if(st.t==="pick"||st.t==="multi") LS.ch=shuffle(st.c.map(x=>({en:x[0],ar:x[1],ok:!!x[2],say:x[3]||""})));

  if(st.t==="query" && st.after) LS.ch=shuffle(st.after.c.map(x=>({en:x[0],ar:x[1],ok:!!x[2],say:x[3]||""})));

}

      if(LS.selL===null){ sfx.no(); toast("Tap a place on the left first"); return true; }

      else { LS.mist=true; LS.selL=null; sfx.no(); render(); cheer("Not that one. Try again 💫",true); }
      return true; }
    case "lpick": { const c=LS.ch[+d.v]; if(c.ok){ t.classList.add("right"); lsWin("Yes!"); } else { t.classList.add("wrong"); t.disabled=true; lsMist(c.say||"Hmm, not that one."); } return true; }
    case "lsel": { const i=+d.v, k=LS.sel.indexOf(i); if(k<0) LS.sel.push(i); else LS.sel.splice(k,1); sfx.tap(); render(); return true; }
    case "lcheck": { const wrong=LS.sel.filter(i=>!LS.ch[i].ok), miss=LS.ch.map((c,i)=>c.ok&&!LS.sel.includes(i)?i:-1).filter(i=>i>=0);
      if(!wrong.length && !miss.length) lsWin("You found them all!"); else lsMist(wrong.length?"One of those is not right.":"There are more. Look again!"); return true; }
    case "lw": { const i=+d.v, k=LS.q.indexOf(i); if(k<0) LS.q.push(i); else LS.q.splice(k,1); sfx.tap(); render(); return true; }
    case "lgo": { const ws=LS.q.map(i=>st.words[i]);
      if(!ws.length){ sfx.no(); return toast("Tap some words first"); }
      const miss=st.need.find(w=>!ws.includes(w)); const junk=ws.find(w=>!st.need.includes(w) && !(st.okx||[]).includes(w));
      if(junk) return lsMist(`"${junk}" doesn't help the search. Take it out.`);
      if(miss) return lsMist(`Add the words: "${miss}".`);

    case "lres": { const r=LS.rs[+d.v]; if(r.ok){ t.classList.add("right"); lsWin("Yes! That's the one."); } else { LS.resWrong.push(+d.v); LS.mist=true; sfx.no(); render(); cheer((r.ad?"That one is an ad. ":"Not that one. ")+"Try again 💫",true); } return true; }
  }

}

/* Drag and drop with a finger or mouse; a plain tap on a tile works too. */
let DRAG=null, dragJustDropped=false;
function dropZoneAt(x,y){ const g=DRAG&&DRAG.ghost; if(g) g.style.display="none"; const el=document.elementFromPoint(x,y); if(g) g.style.display=""; return el && el.closest("[data-drop]"); }
document.addEventListener("pointerdown", e=>{ const t=e.target.closest("[data-drag]"); if(!t || view.name!=="shop") return; DRAG={el:t, x:e.clientX, y:e.clientY, moved:false, ghost:null}; });
document.addEventListener("pointermove", e=>{
  if(!DRAG) return;
  if(!DRAG.moved && Math.hypot(e.clientX-DRAG.x, e.clientY-DRAG.y)>10){ DRAG.moved=true; const g=DRAG.el.cloneNode(true); g.classList.add("ghost"); g.removeAttribute("data-drag"); document.body.appendChild(g); DRAG.ghost=g; DRAG.el.classList.add("lifted"); }
  if(DRAG.ghost){ e.preventDefault(); DRAG.ghost.style.left=e.clientX+"px"; DRAG.ghost.style.top=e.clientY+"px"; const z=dropZoneAt(e.clientX,e.clientY); document.querySelectorAll("[data-drop]").forEach(x=>x.classList.toggle("hot", x===z)); }
}, {passive:false});
function endDrag(e, cancel){
  if(!DRAG) return; const d=DRAG; if(!d.moved){ DRAG=null; return; }
  const z = cancel ? null : dropZoneAt(e.clientX,e.clientY); DRAG=null;
  d.ghost.remove(); d.el.classList.remove("lifted"); document.querySelectorAll("[data-drop]").forEach(x=>x.classList.remove("hot"));
  dragJustDropped=true; setTimeout(()=>dragJustDropped=false, 400);
  if(z) shopApply(d.el.dataset.drag, d.el.dataset.v); else if(!cancel){ sfx.tap(); speak("Drop it on your shop!"); }
}
document.addEventListener("pointerup", e=>endDrag(e,false));
document.addEventListener("pointercancel", e=>endDrag(e,true));

  if(!C.on) return `${navTabs("nova")}<div class="sheet"><div style="font-size:4rem">💬</div><h2>Nova is sleeping</h2><p style="margin:0;font-size:1.15rem">Ask Mama or Baba to wake Nova up in the grown-ups area.</p><span class="ar" dir="rtl" lang="ar">اطلبي من ماما أو بابا يصحّوا نوفا من منطقة الكبار.</span></div>`;
  const left=novaLeft();
  const chips=(NV.msgs.length&&NV.msgs[NV.msgs.length-1].chips)||NOVA_CHIPS.filter(c=>novaTopicOk(topicOf(c[1]))).map(c=>c[0]);
  return `${navTabs("nova")}
  <div class="novawrap"><div class="novahead"><span class="nface">🌟</span><div><b style="font-family:var(--display);font-size:1.4rem">Nova</b><div class="hint">Your star helper · ${left} messages left today</div></div></div>
  <div class="novabox" id="novaBox">${NV.msgs.length?"":`<div class="nb n"><span>Hi ${esc(S.child.name)}! I'm Nova. Tap a button or type to talk to me!</span></div>`}
    ${NV.msgs.map((m,i)=>`<div class="nb ${m.r}"><span>${esc(m.en)}${m.ar?`<small class="ar" dir="rtl" lang="ar">${esc(m.ar)}</small>`:""}</span>${m.r==="n"?`<button class="say sm" data-nv="say" data-v="${i}" aria-label="Read it aloud">🔈</button>`:""}</div>`).join("")}
    ${NV.busy?`<div class="nb n"><span>Nova is thinking… ✨</span></div>`:""}</div>
  <div class="tiles novachips">${chips.map(c=>`<button class="tile sm" data-nv="chip" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="novain"><input type="text" id="novaIn" maxlength="120" placeholder="Type here…" autocomplete="off" ${left<=0?"disabled":""}><button class="btn" data-nv="send" ${left<=0?"disabled":""}>Send ➜</button></div>
  <p class="hint" style="margin:6px 0 0;text-align:center">Nova is a computer helper, not a person. Never share your address or phone number.</p></div>`;
}
function novaClick(d){
  if(d.nv==="send"){ const el=$("#novaIn"); const v=el.value; el.value=""; novaSend(v); return true; }
  if(d.nv==="chip"){ novaSend(d.v.replace(/\s*[\u{1F300}-\u{1FAFF}☀-➿]+\s*$/u,"")); return true; }
  if(d.nv==="say"){ const m=NV.msgs[+d.v]; if(m) speak(m.en,true); return true; }
  return false;
}
function novaParentCard(){

    <label style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="novaAr" ${C.ar?"checked":""} style="width:24px;height:24px"> Add an Arabic line under each answer</label>
    <div><b>Allowed topics</b><div class="themes" style="margin-top:6px">${Object.entries(T).map(([k,v])=>`<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" data-nvt="${k}" ${C.topics[k]?"checked":""} style="width:22px;height:22px"> ${v}</label>`).join("")}</div></div>
    ${flagged?`<p style="margin:0;color:var(--bad);font-weight:800">⚠️ ${flagged} message${flagged>1?"s":""} flagged. Please read them below.</p>`:""}
    <details><summary style="cursor:pointer;font-weight:800">Conversation log (${C.log.length})</summary>
      <div style="max-height:260px;overflow:auto;margin-top:8px;display:grid;gap:6px">${L.length?L.map(x=>`<div style="padding:6px 10px;border-radius:10px;background:${x.flag?"#6b2a2a":"rgba(255,255,255,.07)"}"><small>${new Date(x.t).toLocaleString()} · ${x.r==="u"?name:"Nova"}${x.flag?` · <b>flag: ${x.flag}</b>`:""}</small><div>${esc(x.text)}</div></div>`).join(""):`<span class="hint">Nothing yet.</span>`}</div>
      <button class="btn sm alt" data-act="novaclear" style="margin-top:8px">Clear log</button></details>
  </div>`;
}

   Worlds: a hair salon (like Baba's Hair Force One) and an online coffee-bean shop (beans in bags).
   9 tracks x 5 stages. A stage ends with a project that a grown-up approves in the grown-ups area.
   Post Studio + Gallery, and a pretend smart helper (preset requests, preset answers, nothing leaves the app). */
const BIZ_WORLDS = {
  salon:{e:"💈", en:"My Salon", ar:"الصالون بتاعي", color:"#4f9dff", like:"A hair salon, like Baba's Hair Force One", likeAr:"صالون حلاقة زي Hair Force One بتاع بابا",
    names:["Star Cuts","Comet Cuts","Rocket Barber","Shiny Hair"], logos:["💈","✂️","🪮","💇‍♂️","⭐","👑"],
    usp:[["Fast and always on time","سريع ودايمًا في معاده"],["Super clean","نضيف جدًا"],["Kind to kids","لطيف مع الأطفال"],["Cool new styles","قصات جديدة وشيك"]],
    photos:["chair","tools","happy","front"]},
  coffee:{e:"☕", en:"My Coffee Beans", ar:"متجر البن بتاعي", color:"#a86d42", like:"Coffee beans in bags, sold online and sent to homes", likeAr:"بن قهوة في عبوات، بيتباع أونلاين وبيتشحن للبيوت",
    names:["Star Beans","Moon Coffee","Rocket Roast","Galaxy Beans"], logos:["☕","🫘","⭐","🌙","🚀","🪐"],
    usp:[["Fresh every week","طازة كل أسبوع"],["Fast delivery","توصيل سريع"],["Strong, yummy taste","طعم قوي وحلو"],["Pretty gift bags","عبوات هدايا حلوة"]],
    photos:["bag","beans","cup","box"]},
};
const BIZ_COLORS = [...SHOP_COLORS, ["#8b5a3c","Brown"], ["#2b2b3a","Black"]];
const STAGES = [["⭐","Discover","اكتشاف"],["🪐","Try","تجربة"],["☀️","On my own","لوحدي"],["🌌","Plan","خطة"],["🚀","Real work","شغل حقيقي"]];
const TRACKS = [
  {id:"brand", e:"🎨", en:"Brand", ar:"البراند والميزة", items:[{k:"brand",w:"salon"},{k:"sg",n:1}],
    proj:["Give your salon a name, a color, a logo and a reason to visit","اعملي لصالونك اسم ولون ولوجو وسبب الناس تيجي عشانه"]},
  {id:"posts", e:"🖼️", en:"Posts", ar:"البوستات", items:[{k:"sg",n:2},{k:"sg",n:3},{k:"sg",n:4},{k:"sg",n:5},{k:"studio"}],
    proj:["Make 3 posts and keep them in your gallery","اعملي 3 بوستات واحفظيهم في المعرض"], need:()=>bizS().gallery.length>=3},
  {id:"ai", e:"🤖", en:"Smart Helper", ar:"المساعد الذكي", items:[{k:"ls",id:"ai"},{k:"hlesson"},{k:"helper"}],
    proj:["Ask the helper clearly 3 times and pick a good answer","اطلبي من المساعد بوضوح 3 مرات واختاري إجابة صح"], need:()=>bizS().helper.good>=3},
  {id:"ads", e:"📣", en:"Ads", ar:"الإعلانات", items:[{k:"ls",id:"ads"},{k:"sg",n:6},{k:"sg",n:7},{k:"sg",n:9}],
    proj:["Finish the ads games","خلّصي ألعاب الإعلانات"]},
  {id:"ops", e:"📦", en:"Customers", ar:"العملاء والشحن", items:[{k:"sg",n:8},{k:"oj"}],
    proj:["Answer customers nicely and run orders from message to delivery (2 stars or more)","ردّي على العملاء بلطف ومشّي الطلبات من الرسالة للتسليم (نجمتين أو أكتر)"], need:()=>(bizS().oj||{}).best>=2},
  {id:"web", e:"💻", en:"Websites", ar:"المواقع", items:[{k:"site",w:"salon"},{k:"code"}],

  {id:"grow", e:"🌱", en:"Grow the Business", ar:"تطوير البيزنس", soon:"Coming soon", soonAr:"قريب"},
];
function bizS(){ const B = S.biz ||= {};
  B.salon ||= {name:"",color:"",logo:"",usp:""}; B.coffee ||= {name:"",color:"",logo:"",usp:""};
  B.open ||= {salon:true, coffee:false}; B.stage ||= {}; B.pending ||= {}; B.approved ||= [];
  B.gallery ||= []; B.helper ||= {lesson:false, good:0, asks:0, saved:[], log:[]}; B.daily ||= {date:"",posts:0};
  return B; }
const stageOf = id => bizS().stage[id] || 1;
const bi = (en, ar, big) => `<b${big?' style="font-size:1.2rem"':""}>${esc(en)}</b>${ar?`<span class="ar" dir="rtl" lang="ar">${esc(ar)}</span>`:""}`;
const brandOf = w => { const b=bizS()[w], W=BIZ_WORLDS[w]; return {name:b.name||W.names[0], color:b.color||W.color, logo:b.logo||W.e, set:!!b.name, usp:b.usp}; };
let BZ = {screen:"map"}, FROM_BIZ = false, BZMAP = null;

function itemInfo(it){
  const B=bizS(), G=S.shop.games||{}, L=S.shop.lessons||{};
  if(it.k==="sg"){ const g=SHOP_GAMES.find(x=>x.n===it.n); return {e:g.e, en:`Game ${g.n}: ${g.t}`, ar:g.ar, done:!!G[it.n], lock:it.n>1&&!G[it.n-1]?`Play game ${it.n-1} first`:"", act:`data-sg="${it.n}"`}; }
  if(it.k==="ls"){ const d=lessonDefs()[it.id]; return {e:d.e, en:`Baba's Classroom: ${d.title}`, ar:d.ar, done:!!L[it.id], act:`data-ls="${it.id}"`}; }
  if(it.k==="brand") return {e:BIZ_WORLDS[it.w].e, en:`Brand ${BIZ_WORLDS[it.w].en.replace("My ","my ")}`, ar:"اعملي البراند بتاع "+BIZ_WORLDS[it.w].ar, done:!!(B[it.w].name&&B[it.w].usp), act:`data-bz="brand" data-v="${it.w}"`};
  if(it.k==="studio") return {e:"🎨", en:"Post Studio: make a post", ar:"استوديو البوستات: اعملي بوست", done:B.gallery.length>0, act:`data-bz="studio"`};
  if(it.k==="hlesson") return {e:"🤖", en:"Meet the smart helper", ar:"اتعرفي على المساعد الذكي", done:B.helper.lesson, act:`data-bz="hlesson"`};
  if(it.k==="site") return {e:"💻", en:"Build my website", ar:"اعملي موقعك", done:!!siteOf(it.w).rewarded, act:`data-bz="site" data-v="${it.w}"`};
  if(it.k==="code") return {e:"🔍", en:"Find the button in the code", ar:"لاقي الزرار في الكود", done:!!siteOf("salon").found, act:`data-bz="site" data-v="salon"`};
  if(it.k==="cash") return {e:"🧾", en:"Cashier: prices and change", ar:"الكاشير: الأسعار والباقي", done:!!(B.cash&&B.cash.best>0), lock:cashLevel().add?"":"Play the Addition chapter in Learn first", act:`data-bz="cash" data-v="salon"`};
  if(it.k==="oj") return {e:"📦", en:"Order journey: from message to delivery", ar:"رحلة الطلب: من الرسالة للتسليم", done:!!(B.oj&&B.oj.best>0), act:`data-bz="oj"`};
  if(it.k==="beans") return {e:"🫘", en:"Bean math: cost, price and profit", ar:"حساب البن: التكلفة والسعر والمكسب", done:!!(B.beans&&B.beans.best>0), wlock:!B.open.coffee, lock:!B.open.coffee?"Baba opens the coffee shop first":cashLevel().add?"":"Play the Addition chapter in Learn first", act:`data-bz="beans"`};
  if(it.k==="helper") return {e:"💬", en:"Ask the helper", ar:"اطلبي من المساعد", done:B.helper.good>0, act:`data-bz="helper"`};
}
function trackState(T){
  if(T.soon) return {soon:true};
  const infos=T.items.map(itemInfo), req=infos.filter(i=>!i.wlock), done=req.filter(i=>i.done).length, all=done===req.length && (!T.need || T.need());
  return {infos, done, total:req.length, ready:all, pending:!!bizS().pending[T.id], stage:stageOf(T.id)};
}

function bizTrackView(){
  const T=TRACKS.find(x=>x.id===BZ.t), s=trackState(T);
  const steps=STAGES.map((st,i)=>`<div class="bzstage ${i+1<s.stage?"done":i+1===s.stage?"now":""}"><span>${st[0]}</span><b>${st[1]}</b><small dir="rtl" lang="ar">${st[2]}</small></div>`).join("");
  const body = s.stage>1 ? `<div class="card" style="text-align:center">${bi(`Stage ${s.stage} opens with the next update! ✨`,"المرحلة دي هتتفتح مع التحديث الجاي!",true)}<p class="hint" style="margin:0">You can still play stage 1 games for more stars.</p></div>` : "";
  const items = s.infos.map(i=>`<button class="bzitem ${i.done?"done":""} ${i.lock?"locked":""}" ${i.act}><span class="bzie">${i.e}</span><span style="min-width:0">${bi(i.en,i.ar)}${i.lock?`<small class="hint">🔒 ${esc(i.lock)}</small>`:""}</span><span class="bzcheck">${i.done?"✅":"▶️"}</span></button>`).join("");
  const proj = `<div class="card bzproj ${s.ready?"ready":""}"><h3 style="margin:0">🎁 Stage project · مشروع المرحلة</h3>${bi(T.proj[0],T.proj[1])}

    : s.ready&&s.stage===1?`<button class="btn" data-bz="send" data-v="${T.id}">✉️ Send to Baba</button>`
    : s.stage>1?`<p class="hint" style="margin:0">✅ Baba said yes!</p>`:`<p class="hint" style="margin:0">Finish everything above first. <span class="ar" dir="rtl" lang="ar" style="display:inline">خلّصي كل اللي فوق الأول.</span></p>`}</div>`;
  return `${navTabs("biz")}${bizBack("world", BIZ_WORLDS[BZ.w||"salon"].en)}

  }

/* ---------- Cashier: prices and change with the numbers from her math book ---------- */
const CATALOG = {
  salon:[["Haircut","قصة شعر","💇‍♂️",5],["Hair wash","غسيل شعر","🚿",2],["Beard trim","تهذيب دقن","🧔",3],["Kids cut","قصة أطفال","👦",4],["Hair gel","جل شعر","🧴",1]],
  coffee:[["Small bag","عبوة صغيرة","🫘",3],["Big bag","عبوة كبيرة","🛍️",6],["Gift bag","عبوة هدية","🎁",5],["Delivery","توصيل","🚚",2],["Cup","فنجان","☕",1]],
};
function cashLevel(){ return {add:unitPlayed("u3"), sub:unitPlayed("u4"), big:unitPlayed("u7")}; }
function cashRound(){
  const C=BZ.c, L=cashLevel(), cat=CATALOG[C.w].map(x=>({en:x[0],ar:x[1],e:x[2],p:L.big?x[3]*2:x[3]}));
  const max=L.big?20:10, types=["total"]; if(L.sub) types.push("change","change");
  const t=pick(types); let q;
  if(t==="total"){ let a,b,g=0; do{ a=pick(cat); b=pick(cat); }while(a.p+b.p>max && g++<50); if(a.p+b.p>max){ a=cat[4]; b=cat[1]; }
    q={t, items:[a,b], ans:a.p+b.p, en:`The customer wants ${a.en} and ${b.en}. How much altogether?`, ar:`الزبون عايز ${a.ar} و${b.ar}. كام الحساب كله؟`}; }
  else { const pay=max, a=pick(cat.filter(x=>x.p<pay));
    q={t, items:[a], pay, ans:pay-a.p, en:`${a.en} costs ${a.p}. The customer pays ${pay}. How much change?`, ar:`${a.ar} بـ${a.p}. الزبون دفع ${pay}. نرجعله كام باقي؟`}; }
  q.ch=numChoices(q.ans,0,max); C.q=q; C.tried=false;
}
function cashStart(w){ if(!cashLevel().add){ sfx.no(); toast("🔒 Play the Addition chapter in Learn first · العبي فصل الجمع الأول"); return; }
  BZ={screen:"cash", w, from:BZ.screen, c:{w, i:0, n:6, first:0}}; cashRound(); go({name:"biz"}); }
function cashView(){
  const C=BZ.c, q=C.q, br=brandOf(C.w);
  if(C.done) return `<div class="sheet"><h2>🧾 Cashier done!</h2>${C.first===C.n?`<div class="duper">🌟 Super duper, ${esc(S.child.name)}! 🌟</div>`:""}<div class="bigstars">${"★".repeat(C.stars)}<span class="e">${"★".repeat(3-C.stars)}</span></div>
    <p style="margin:0;font-size:1.15rem">${C.first} of ${C.n} right the first time. You used your math to run ${esc(br.name)}!<span class="ar" dir="rtl" lang="ar">استخدمتي الرياضة عشان تشغّلي المحل!</span></p>
    <div class="row"><button class="btn" data-bz="cash" data-v="${C.w}">Play again</button><button class="btn alt" data-bz="world" data-v="${C.w}">${esc(br.name)}</button></div></div>`;
  const dots=Array.from({length:C.n},(_,k)=>`<i class="${k<C.i?"ok":""} ${k===C.i?"now":""}"></i>`).join("");
  return `<div class="game shopgame"><div class="gtop"><button class="back" style="margin:0" data-bz="world" data-v="${C.w}">← Stop</button><b style="font-family:var(--display);font-size:1.3rem">🧾 ${esc(br.name)} cashier</b><div class="dots">${dots}</div></div>
  <div class="sheet" style="max-width:760px">
    <div class="cashitems">${q.items.map(it=>`<div class="cashit"><span>${it.e}</span><b>${esc(it.en)}</b><small dir="rtl" lang="ar">${esc(it.ar)}</small><em>🪙 ${it.p}</em></div>`).join("")}${q.pay?`<div class="cashit pay"><span>💵</span><b>Pays</b><small dir="rtl" lang="ar">دفع</small><em>🪙 ${q.pay}</em></div>`:""}</div>
    ${bi(q.en,q.ar,true)}<button class="say" data-bz="csay" aria-label="Read it aloud">🔈</button>
    <div class="tiles">${q.ch.map(c=>`<button class="tile cashans" data-bz="cans" data-v="${c.value}">${c.value}</button>`).join("")}</div>
    <div class="cheer" id="cheer" aria-live="polite"></div></div></div>`;
}
function cashAnswer(v, t){
  const C=BZ.c, ok=+v===C.q.ans;
  if(!C.tried){ if(ok) C.first++; } C.tried=true;
  if(!ok){ t.classList.add("wrong"); t.disabled=true; sfx.no(); cheer(C.q.t==="change"?"Count up from the price to what they paid! Try again 💫  عدّي من التمن لحد اللي دفعه":"Add the two prices. Try again 💫  اجمعي التمنين",true); return; }
  t.classList.add("right"); sfx.ok(); cheer("Yes! "+C.q.ans+" ⭐ صح!");
  setTimeout(()=>{ if(BZ.screen!=="cash"||BZ.c!==C) return; C.i++; if(C.i>=C.n){ const r=C.first/C.n; C.stars=r>=.85?3:r>=.6?2:1; C.done=true;
      const B=bizS(); B.cash ||= {plays:0,best:0}; B.cash.plays++; B.cash.best=Math.max(B.cash.best,C.stars); B.cash.last=Date.now(); addStars(C.stars); markDay("biz"); save(); sfx.win(); render(); winSpeak(C.first===C.n, C.stars>=2, C.first, C.n, C.stars); }
    else { cashRound(); render(); } }, 1100);
}

function b13Click(d, t){
  const v=d.v;
  switch(d.bz){
    case "gatebtn": sfx.no(); toast("📚 School first! · المدرسة الأول"); return true;
    case "cash": sfx.tap(); cashStart(v||BZ.w||"salon"); return true;
    case "cans": cashAnswer(v, t); return true;
    case "csay": speak(BZ.c.q.en,true); return true;
    case "site": sfx.tap(); BZ={screen:"site", w:v||BZ.w||"salon"}; siteOf(BZ.w); go({name:"biz"}); return true;
    case "wadd": { const s=siteOf(BZ.w); if(!s.blocks.includes(v)) s.blocks.push(v); sfx.ok(); siteSave(BZ.w, s.blocks.length-1); render(); return true; }
    case "wdel": { const s=siteOf(BZ.w); s.blocks.splice(+v,1); sfx.tap(); siteSave(BZ.w,-1); render(); return true; }
    case "wup": case "wdown": { const s=siteOf(BZ.w), i=+v, j=d.bz==="wup"?i-1:i+1; if(j<0||j>=s.blocks.length) return true; [s.blocks[i],s.blocks[j]]=[s.blocks[j],s.blocks[i]]; sfx.tap(); siteSave(BZ.w,j); render(); return true; }
    case "wphoto": { const s=siteOf(BZ.w), P=BIZ_WORLDS[BZ.w].photos; s.photo=P[(P.indexOf(s.photo)+1)%P.length]; s.last=s.blocks.indexOf("photo"); sfx.tap(); save(); render(); return true; }
    case "wcode": BZ.code=!BZ.code; BZ.find=false; sfx.tap(); render(); return true;
    case "wfind": BZ.find=true; BZ.wrongL=[]; sfx.tap(); render(); return true;
    case "wline": { if(!BZ.find) return true; const s=siteOf(BZ.w), b=s.blocks[+v];
      if(b==="button"){ BZ.find=false; s.last=+v; const first=!s.found; s.found=true; const ns=first?addStars(2):[]; markDay("biz"); save(); sfx.win(); render(); cheer("Yes! That line makes the button ⭐ صح! السطر ده بيعمل الزرار"); if(ns.length) toast("New sticker! "+ns.join(" ")); }
      else { BZ.wrongL.push(+v); sfx.no(); render(); cheer(`That line makes the ${SITE_BLOCKS[b][1].toLowerCase()}. Look for <button>! Try again 💫`,true); } return true; }
    case "sword": { const o=BZ.o; o.sub ||= []; if(o.sub.includes(v)) o.sub=o.sub.filter(x=>x!==v); else if(o.sub.length<3) o.sub.push(v); else { sfx.no(); cheer("3 words is enough 🙂 كفاية 3 كلمات",true); return true; } sfx.tap(); render(); return true; }
    case "pshare": bizS().share=+v; save(); render(); return true;
    case "pgate": bizS().gate = bizS().gate===false; save(); render(); return true;
  }
  return false;
}

const coins = (n, cls) => `<span class="bcoins">${Array.from({length:n},()=>`<i class="${cls||""}">🪙</i>`).join("")}</span>`;
function beansRound(){
  const Bm=BZ.b, L=cashLevel(), types=["cost","pl","price","many"]; if(L.sub) types.push("profit","profit");
  let t=pick(types); if(Bm.lastT===t) t=pick(types); Bm.lastT=t; let q;
  if(t==="cost"){ const a=rnd(2,6), b=rnd(1,2); q={t, a, b, ans:a+b, en:`Beans for one bag cost ${a}. The empty bag costs ${b}. How much does one full bag cost us?`, ar:`البن اللي في العبوة بـ${a}، والعبوة الفاضية بـ${b}. العبوة المليانة بتكلّفنا كام؟`, vis:`<div class="bvis"><span>🫘 ${coins(a)}</span><b>+</b><span>🛍️ ${coins(b)}</span></div>`}; }
  else if(t==="profit"){ const c=rnd(3,7), p=c+rnd(1,4); q={t, c, p, ans:p-c, en:`One bag costs us ${c}. We sell it for ${p}. How much do we earn? That is the PROFIT.`, ar:`العبوة بتكلّفنا ${c}، وبنبيعها بـ${p}. بنكسب كام؟ ده اسمه المكسب.`, vis:`<div class="bvis"><span>🏷️ ${p}: ${coins(c,"cost")}${coins(p-c,"gain")}</span></div><p class="hint" style="margin:0">🟤 cost · التكلفة &nbsp; 🟡 profit · المكسب</p>`}; }
  else if(t==="pl"){ const c=rnd(3,7), k=pick([1,1,0,-1]), p=Math.max(1,c+k*rnd(1,2)); const ans=p>c?"gain":p===c?"zero":"loss";
    q={t, c, p, ans, en:`It costs us ${c}. We sell it for ${p}. Do we earn money?`, ar:`بتكلّفنا ${c}، وبنبيعها بـ${p}. هل بنكسب؟`, vis:`<div class="bvis"><span>💰 Cost · التكلفة ${coins(c,"cost")}</span><span>🏷️ Price · السعر ${coins(p)}</span></div>`,
      opts:[["gain","😀 Profit","بنكسب"],["zero","😐 No profit","لا مكسب ولا خسارة"],["loss","😢 Loss","بنخسر"]]}; }
  else if(t==="price"){ const c=rnd(3,8), g=rnd(1,3); q={t, c, g, ans:c+g, en:`One bag costs us ${c}. Set the price so we earn ${g} on each bag.`, ar:`العبوة بتكلّفنا ${c}. حطي السعر عشان نكسب ${g} في كل عبوة.`}; Bm.price=c; }
  else { const n=rnd(2,3), g=rnd(1,3); q={t, n, g, ans:n*g, en:`We sold ${n} bags. We earn ${g} on each bag. How much did we earn altogether?`, ar:`بعنا ${n} عبوات، وبنكسب ${g} في كل عبوة. كسبنا كام كله؟`, vis:`<div class="bvis">${Array.from({length:n},()=>`<span>🫘 ${coins(g,"gain")}</span>`).join("<b>+</b>")}</div>`}; }
  if(typeof q.ans==="number" && t!=="price") q.ch=numChoices(q.ans,0,20);
  Bm.q=q; Bm.tried=false; Bm.wrong=[];
}

  if(d.choice!==undefined){ const c=game.q.choices[+d.choice]; return answer(+d.choice, t); }
  if(d.pin) return pinKey(d.pin);
  if(d.bitem){ const [id,costS]=d.bitem.split("|"), cost=+costS, B=S.base;
    if(cost>0 && !B.owned[id]){ if(wallet()<cost){ sfx.no(); speak(`You need ${cost-wallet()} more stars for that!`); return toast(`Need ${cost-wallet()} more ★`); } S.spent+=cost; B.owned[id]=true; sfx.win(); speak("Ta-da!"); } else sfx.tap();
    B.sel=id; save(); return render(); }
  if(d.bcat){ S.base.cat=d.bcat; sfx.tap(); save(); return render(); }
  if(d.bwall){ curRoom().wall=d.bwall; sfx.tap(); save(); return render(); }
  if(d.bfloor){ curRoom().floor=d.bfloor; sfx.tap(); save(); return render(); }
  if(d.broom!==undefined){ const k=+d.broom; if(S.stars<ROOM_AT[k]){ sfx.no(); speak("Collect more stars to open this room!"); return toast(`Earn ${ROOM_AT[k]-S.stars} more ★ to open this room`); } S.base.cur=k; sfx.tap(); save(); return render(); }
  if(d.wear){ const [slot,val,costS]=d.wear.split("|"); const cost=+costS; const key=slot+":"+val;
    if(cost>0 && !S.owned[key]){ if(wallet()<cost){ sfx.no(); speak(`You need ${cost-wallet()} more stars for that!`); return toast(`Need ${cost-wallet()} more ★`); } S.spent+=cost; S.owned[key]=true; sfx.win(); speak("Ta-da!"); }
    else sfx.tap();
    S.avatar[slot]=val; save(); return render(); }
  if(d.hwdone){ const h=S.homework.find(x=>x.id===d.hwdone); if(h&&!h.done){ h.done=true; h.doneAt=Date.now(); const ns=addStars(h.stars); S.cheers.push(`Mama gave you ${h.stars} stars for your homework!${ns.length?" New sticker: "+ns.join(" "):""}`); save(); toast(`Gave ${h.stars} stars`); render(); } return; }
  if(d.hwdel){ const h=S.homework.find(x=>x.id===d.hwdel); if(h?.photo?.local) try{localStorage.removeItem(h.photo.local);}catch(e){} if(h?.photo?.asset && ASSETS) ASSETS.delete(h.photo.asset).catch(()=>{}); S.homework=S.homework.filter(x=>x.id!==d.hwdel); save(); return render(); }
  switch(d.act){
    case "setup": { const n=$("#setupName").value.trim(); if(!n) return toast("Type a name first"); S.child.name=n; save(); go({name:"home",subject:"math"}); speak(`Welcome to Star Academy, ${n}!`); break; }
    case "say": langSay(game.q,true); break;
    case "novaclear": S.chat.log=[]; save(); render(); break;
    case "quit": go(game&&game.mode==="explore" ? {name:"explore"} : game&&(game.lesson||game.mode) ?{name:"home",subject:LAST_SUBJ} : {name:"unit", unit:view.unit}); break;
    case "addlesson": addLesson(); break;
    case "copyreport": { const t=reportText(), ta=$("#reportTxt"); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("Report copied")).catch(()=>{ ta.focus(); ta.select(); toast("Select the text and copy it"); }); break; }
    case "rmphoto": delete S.child.photo; save(); render(); break;
    case "cheerok": S.cheers.shift(); sfx.win(); save(); render(); break;
    case "lock": go({name:"home",subject:"math"}); break;
    case "hwadd": addHomework(); break;
    case "extra": S.extra = {date:today(), min:(S.extra.date===today()?S.extra.min:0)+15}; save(); toast("Added 15 minutes for today"); render(); break;
    case "savename": { const n=$("#nameIn").value.trim(); if(n){ S.child.name=n; save(); toast("Name saved"); render(); } break; }
    case "changepin": pinBuf=""; pinStage="create"; go({name:"pin"}); break;
    case "reset": S._confirmReset=true; render(); break;
    case "resetno": S._confirmReset=false; render(); break;
    case "resetyes": { const keep={pin:S.pin, child:S.child, limitMin:S.limitMin, sound:S.sound, autoVoice:S.autoVoice, timer:S.timer, tspeed:S.tspeed}; S.homework.forEach(h=>{ if(h.photo?.local) try{localStorage.removeItem(h.photo.local);}catch(e){} }); S=Object.assign(fresh(),keep); save(); toast("Progress cleared"); render(); break; }
  }
});

(function(){ const c=$("#sky"), x=c.getContext("2d"); let W,H,stars=[]; const still=matchMedia("(prefers-reduced-motion: reduce)").matches;

const VEH = {rocket:"🚀", train:"🚂🚃🚃", cloud:"☁️", portal:""};

/* ---- state ---- */
const LK = () => { S.look ||= {}; const L=S.look; if(L.rot===undefined) L.rot=true; if(L.kid===undefined) L.kid=true; if(L.trans===undefined) L.trans=true; if(L.intro===undefined) L.intro=true; L.force ||= {}; L.pick ||= {}; L.seen ||= {}; return L; };
const MU = () => { S.music ||= {}; const M=S.music; if(M.on===undefined) M.on=false; if(M.vol===undefined) M.vol=5; if(!M.every) M.every="day"; if(M.n===undefined) M.n=0; return M; };
const dayNo = () => { const d=new Date(); return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(2000,0,1))/864e5); };
const weekNo = () => Math.floor(dayNo()/7); /* 1 Jan 2000 was a Saturday, so weeks start on Saturday */
function skinIdx(z){
  const L=LK(), n=ZONES[z].skins.length;
  if(L.force[z]!=null && L.force[z]!=="" ) return (+L.force[z])%n;
  const p=L.pick[z]; if(p && p.w===weekNo()) return p.i%n;
  return L.rot ? (weekNo()+H(z))%n : 0;
}
const skinOf = z => ZONES[z].skins[skinIdx(z)];

/* ---- which zone is on screen ---- */
let LASTZ = "galaxy";
function subjOfSkill(id){
  if(!id) return null;
  if(String(id).startsWith("lesson:")){ const l=(S.school||[]).find(x=>x.id===id.slice(7)); const s=(l&&l.subject||"").toLowerCase(); return s==="english"?"english":s==="arabic"?"arabic":s==="math"?"math":"galaxy"; }
  for(const s of SUBJECTS) for(const u of (s.units||[])) if((u.skills||[]).includes(id)) return s.id;
  return null;
}
const subjZone = s => s==="math"?"math":s==="english"?"english":s==="arabic"?"arabic":s==="shop"?"shop":null;
function zoneOf(){
  if(!S.child || !S.child.name) return "galaxy";
  const v=view||{}, n=v.name;
  if(n==="parent"||n==="pin") return "parent";
  if(n==="home") return subjZone(v.subject)||"galaxy";
  if(n==="unit"){ const u=typeof findUnit==="function"?findUnit(v.unit):null; if(u){ for(const s of SUBJECTS) if(s.units.includes(u)) return subjZone(s.id)||"galaxy"; } return LASTZ; }
  if(n==="challenges") return "math";
  if(n==="game"||n==="result"){ if(typeof game!=="undefined" && game){ if(["chal","check","mix"].includes(game.mode)) return "math"; const z=subjZone(subjOfSkill(game.skill)); if(z) return z; if(game.zone) return game.zone; } return LASTZ==="parent"?"galaxy":LASTZ; }
  if(n==="shop") return "shop";
  if(n==="biz"){ const b=(typeof BZ!=="undefined"&&BZ)||{}, sc=b.screen;
    if(sc==="studio"||sc==="gallery") return "studio";
    if(sc==="helper"||sc==="hlesson"||sc==="site") return "coding";
    if(sc==="map"||sc==="tasks") return "town";
    if(sc==="beans") return "coffee";
    const w=b.w||(b.o&&b.o.w)||(b.c&&b.c.w); if(w==="coffee") return "coffee"; if(w==="salon") return "salon";
    return "town"; }
  if(ZONES[n]) return n;
  return "galaxy";
}

/* ---- apply skin ---- */
let ZCUR=null, ZSKIN=null;
function zApply(z, force){
  const Z=ZONES[z], s=skinOf(z), key=z+"/"+s.n;
  if(!force && key===ZSKIN) return; ZSKIN=key;
  const b=document.body, [sp,sp2,pa,pa2,st,pk,mi,sky,mu]=s.c;
  b.classList.toggle("zskin", z!=="galaxy" || skinIdx(z)!==0);
  b.dataset.zone=z;
  const set=(k,v)=>b.style.setProperty(k,v);
  set("--space",sp); set("--space2",sp2); set("--panel",pa); set("--panel2",pa2); set("--star",st); set("--pink",pk); set("--mint",mi); set("--sky",sky); set("--muted",mu);
  set("--display",`${Z.font},"Baloo 2","Trebuchet MS",system-ui,sans-serif`);
  set("--zr",Z.shape[0]+"px"); set("--zrb",Z.shape[1]+"px"); set("--zbw",Z.shape[2]+"px"); set("--zglow",Z.shape[3]||"none");
  set("--zsky", s.sky||"transparent");
  const bg=document.getElementById("zbg");
  if(bg){ bg.className = Z.pat?"pat-"+Z.pat:""; bg.innerHTML = (Z.deco||[]).concat(Z.deco||[]).map((e,i)=>`<i style="left:${(i*37+H(z)%23)%92}%;top:${(i*53+11)%86}%;--s:${26+(i*7)%24}px;--d:${16+(i*5)%14}s;--dl:-${i*3}s">${e}</i>`).join(""); }
  const skyEl=document.getElementById("sky"); if(skyEl) skyEl.style.opacity = (z==="galaxy"||z==="english"||z==="arabic"||z==="math") ? "1" : ".35";
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", sp);
  chip(z);
}
function chip(z){
  const c=document.getElementById("zchip"); if(!c) return; const Z=ZONES[z], s=skinOf(z);
  c.innerHTML=`<span class="zg" aria-hidden="true">${Z.g}</span><span><b>${esc(Z.en)}</b><small dir="rtl" lang="ar">${esc(Z.ar)}</small></span>`;
  c.setAttribute("aria-label", `${Z.en}. Look: ${s.n}. Tap to see it.`);
}

/* ---- dock buttons ---- */
function ensureDock(){
  if(document.getElementById("zchip")) return;
  const me=document.getElementById("meBtn"); if(!me) return;
  const c=document.createElement("button"); c.className="zchip"; c.id="zchip"; c.dataset.zx="looks"; me.after(c);
  const sb=document.getElementById("soundBtn");
  const mb=document.createElement("button"); mb.className="iconbtn zmus"; mb.id="zMus"; mb.dataset.zx="music"; sb.before(mb);
  const nb=document.createElement("button"); nb.className="iconbtn"; nb.id="zNext"; nb.dataset.zx="nexttune"; nb.textContent="⏭️"; nb.setAttribute("aria-label","Next tune"); sb.before(nb);
  if(!document.getElementById("zbg")){ const bg=document.createElement("div"); bg.id="zbg"; bg.setAttribute("aria-hidden","true"); const sky=document.getElementById("sky"); (sky||document.body.firstChild).after(bg); }
  for(const id of ["ztrans","zentry"]) if(!document.getElementById(id)){ const d=document.createElement("div"); d.id=id; if(id==="zentry"){ d.hidden=true; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); } else d.setAttribute("aria-hidden","true"); document.body.appendChild(d); }
}
function musBtn(){ const M=MU(), b=document.getElementById("zMus"); if(!b) return; b.textContent=M.on?"🎵":"🎶"; b.classList.toggle("on",M.on); b.setAttribute("aria-label",M.on?"Music on, tap to stop":"Music off, tap to play"); const nb=document.getElementById("zNext"); if(nb) nb.hidden=!M.on; }

/* ---- transitions ---- */
function playTrans(z){
  const t=document.getElementById("ztrans"); if(!t) return; const Z=ZONES[z], s=skinOf(z);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let inner="";
  if(!reduce){ if(Z.veh==="rocket") inner=`<span class="veh"><span>${VEH.rocket}</span></span>`;
    else if(Z.veh==="train") inner=`<span class="rail"></span><span class="veh">${VEH.train}</span>`;

const rng = seed => () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

const MUS = {ctx:null, out:null, z:null, song:null, step:0, next:0, timer:null};
function tuneSeed(z){ const M=MU(); const b = M.every==="never"?0 : M.every==="week"?weekNo() : M.every==="visit"?(MUS.visit ||= Math.floor(Math.random()*1e6)) : dayNo(); return H(z)+b*7919+M.n*104729; }
function makeSong(z){
  const P=MZ[z]||MZ.galaxy, r=rng(tuneSeed(z)), sc=P.sc, meter=P.meter||4, per=meter*2, bars=8;
  const prog=P.prog[Math.floor(r()*P.prog.length)], deg=d=>sc[((d%sc.length)+sc.length)%sc.length]+12*Math.floor(d/sc.length);
  const lead=[], bass=[], pad=[], perc=[]; let pos=Math.floor(r()*sc.length)+sc.length;
  for(let b=0;b<bars;b++){ const ch=prog[b%prog.length];
    pad.push([deg(ch),deg(ch+2),deg(ch+4)].concat(P.sev?[deg(ch+6)]:[]));
    for(let i=0;i<per;i++){
      if(P.arp){ lead.push(i%2===0||r()<.5 ? deg(ch + [0,2,4,7][i%4]) + P.oct : null); }
      else { const strong=i%2===0; if(r()<P.dens*(strong?1.2:.7)){ if(strong && r()<.6){ const tones=[ch,ch+2,ch+4,ch+sc.length]; pos=tones[Math.floor(r()*tones.length)]; } else pos+=Math.floor(r()*3)-1; pos=Math.max(0,Math.min(sc.length*2+2,pos)); lead.push(deg(pos)+P.oct-12); } else lead.push(null); }
      bass.push(i===0 ? deg(ch)-12 : (meter===4&&i===4 ? deg(ch+(r()<.5?4:0))-12 : (meter===3&&(i===2||i===4)? deg(ch+2)-12 : null)));
      perc.push(P.perc===2 ? ([1,0,0,2,0,1,2,0][i%8]||0) : P.perc===1 ? (i%4===0?1:i%2===0?2:0) : P.perc===3 ? (i%2===1?2:0) : 0);

function note(f, t, d, type, vol, out){
  const c=MUS.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0005,t+d);
  o.connect(g).connect(out||MUS.out); o.start(t); o.stop(t+d+.05);
}
function hit(kind, t){
  const c=MUS.ctx;
  if(kind===1){ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(50,t+.15); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g).connect(MUS.out); o.start(t); o.stop(t+.2); }
  else { const n=c.createBufferSource(), len=c.sampleRate*.05, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); n.buffer=buf; const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=5000; const g=c.createGain(); g.gain.value=.12; n.connect(f).connect(g).connect(MUS.out); n.start(t); }
}
function tick(){
  const c=MUS.ctx, s=MUS.song; if(!c||!s) return;
  while(MUS.next < c.currentTime+.25){
    const i=MUS.step%s.len, t=MUS.next, root=s.P.root;
    if(i%s.per===0){ const ch=s.pad[Math.floor(i/s.per)]; ch.forEach(m=>note(mf(root+m),t,s.dt*s.per*1.05,"sine",.05)); }
    if(s.lead[i]!=null) note(mf(root+s.lead[i]),t,s.dt*(s.P.arp?1.2:1.8),s.P.lead,s.P.lead==="square"?.07:.16);
    if(s.bass[i]!=null) note(mf(root+s.bass[i]),t,s.dt*2.5,s.P.bass,s.P.bass==="sawtooth"||s.P.bass==="square"?.06:.18);
