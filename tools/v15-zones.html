    for(let i=0;i<per;i++){
      if(P.arp){ lead.push(i%2===0||r()<.5 ? deg(ch + [0,2,4,7][i%4]) + P.oct : null); }
      else { const strong=i%2===0; if(r()<P.dens*(strong?1.2:.7)){ if(strong && r()<.6){ const tones=[ch,ch+2,ch+4,ch+sc.length]; pos=tones[Math.floor(r()*tones.length)]; } else pos+=Math.floor(r()*3)-1; pos=Math.max(0,Math.min(sc.length*2+2,pos)); lead.push(deg(pos)+P.oct-12); } else lead.push(null); }
      bass.push(i===0 ? deg(ch)-12 : (meter===4&&i===4 ? deg(ch+(r()<.5?4:0))-12 : (meter===3&&(i===2||i===4)? deg(ch+2)-12 : null)));
      perc.push(P.perc===2 ? ([1,0,0,2,0,1,2,0][i%8]||0) : P.perc===1 ? (i%4===0?1:i%2===0?2:0) : P.perc===3 ? (i%2===1?2:0) : 0);
    } }
  return {P, lead, bass, pad, perc, per, len:bars*per, dt:60/P.bpm/2};
}
function note(f, t, d, type, vol, out){
  const c=MUS.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0005,t+d);
  o.connect(g).connect(out||MUS.out); o.start(t); o.stop(t+d+.05);
}
function hit(kind, t){
  const c=MUS.ctx;
  if(kind===1){ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(50,t+.15); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g).connect(MUS.out); o.start(t); o.stop(t+.2); }
  else { const n=c.createBufferSource(), len=c.sampleRate*.05, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); n.buffer=buf; const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=5000; const g=c.createGain(); g.gain.value=.12; n.connect(f).connect(g).connect(MUS.out); n.start(t); }
}
function tick(){
  const c=MUS.ctx, s=MUS.song; if(!c||!s) return;
  while(MUS.next < c.currentTime+.25){
    const i=MUS.step%s.len, t=MUS.next, root=s.P.root;
    if(i%s.per===0){ const ch=s.pad[Math.floor(i/s.per)]; ch.forEach(m=>note(mf(root+m),t,s.dt*s.per*1.05,"sine",.05)); }
    if(s.lead[i]!=null) note(mf(root+s.lead[i]),t,s.dt*(s.P.arp?1.2:1.8),s.P.lead,s.P.lead==="square"?.07:.16);
    if(s.bass[i]!=null) note(mf(root+s.bass[i]),t,s.dt*2.5,s.P.bass,s.P.bass==="sawtooth"||s.P.bass==="square"?.06:.18);
    if(s.perc[i]) hit(s.perc[i],t);
    MUS.step++; MUS.next+=s.dt;
  }
}
function musStart(z){
  const M=MU(); if(!M.on) return;
  try{
    if(!MUS.ctx){ MUS.ctx=new (window.AudioContext||window.webkitAudioContext)(); const lp=MUS.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600; MUS.master=MUS.ctx.createGain(); MUS.master.gain.value=0; lp.connect(MUS.master).connect(MUS.ctx.destination); MUS.out=lp; }
    const c=MUS.ctx; if(c.state==="suspended") c.resume();
    const vol=.04+.032*M.vol; const g=MUS.master.gain;
    if(MUS.z!==z || !MUS.song){ g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(0,c.currentTime+.3);
      const go=()=>{ MUS.z=z; MUS.song=makeSong(z); MUS.step=0; MUS.next=c.currentTime+.05; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(0,c.currentTime); g.linearRampToValueAtTime(vol,c.currentTime+1.2); };
      if(MUS.song) setTimeout(go,320); else go(); }
    else { g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(vol,c.currentTime+.4); }
    if(!MUS.timer) MUS.timer=setInterval(tick,90);
  }catch(e){}
}
function musStop(){ try{ if(MUS.ctx){ const g=MUS.master.gain, c=MUS.ctx; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(0,c.currentTime+.4); } }catch(e){} clearInterval(MUS.timer); MUS.timer=null; MUS.song=null; MUS.z=null; }
window.Music15 = {start:musStart, stop:musStop, song:makeSong};
document.addEventListener("visibilitychange", ()=>{ if(!MUS.ctx) return; if(document.hidden) MUS.ctx.suspend(); else if(MU().on) MUS.ctx.resume(); });
/* the browser only allows sound after a tap, so a saved "music on" starts on the first touch */
document.addEventListener("pointerdown", ()=>{ if(MU().on && !MUS.timer) musStart(ZCUR||"galaxy"); }, {capture:true});

/* ---- game flavour: the zone guide sits in the game bar and cheers ---- */
function gameGuide(z){
  const top=document.querySelector(".game .gtop"); if(!top || top.querySelector(".zguide")) return; const Z=ZONES[z]; if(Z.calm) return;
  const el=document.createElement("span"); el.className="zguide"; el.innerHTML=`<span class="zgf" aria-hidden="true">${Z.g}</span><span class="zsay"></span>`; top.appendChild(el);
  const ch=document.getElementById("cheer"); if(!ch) return;
  new MutationObserver(()=>{ if(!ch.textContent || ch.className.includes("no")) return; el.querySelector(".zsay").textContent=Z.praise[Math.floor(Math.random()*Z.praise.length)]; el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); clearTimeout(el.t); el.t=setTimeout(()=>el.classList.remove("hop"),1200); }).observe(ch,{childList:true,characterData:true,subtree:true});
}

/* ---- grown-ups settings card ---- */
function parentCard(){
  const host=document.querySelector(".parent .grid2"); if(!host || document.getElementById("zset")) return;
  const L=LK(), M=MU(), wk=weekNo();
  const rows=Object.entries(ZONES).map(([z,Z])=>{ const auto=Z.skins[L.rot?(wk+H(z))%Z.skins.length:0];
    return `<div class="zrow"><span>${Z.g} ${esc(Z.en)}</span><select data-zs="force" data-z="${z}"><option value="">Auto (now: ${esc(auto.n)})</option>${Z.skins.map((s,i)=>`<option value="${i}" ${String(L.force[z])===String(i)?"selected":""}>${esc(s.n)}</option>`).join("")}</select></div>`; }).join("");
  const card=document.createElement("div"); card.className="card zset"; card.id="zset";
  card.innerHTML=`<h2>🎨 Looks, worlds and music</h2>
    <p class="hint">Every zone has its own look, guide and music. Looks change by themselves every Saturday so the app keeps feeling new. شكل كل عالم بيتغير لوحده كل سبت.</p>
    <label><input type="checkbox" data-zs="rot" ${L.rot?"checked":""}> Change looks every week by themselves</label>
    <label><input type="checkbox" data-zs="kid" ${L.kid?"checked":""}> ${esc(S.child.name||"Child")} can pick this week's look</label>
    <label><input type="checkbox" data-zs="trans" ${L.trans?"checked":""}> Rocket, train and cloud rides between worlds</label>
    <label><input type="checkbox" data-zs="intro" ${L.intro?"checked":""}> Welcome screen when entering a world (once a day)</label>
    <h3 style="margin-top:6px">Look for each zone</h3>${rows}
    <h3 style="margin-top:6px">🎵 Background music</h3>
    <p class="hint">Soft music made inside the app (no downloads). It is off until someone taps 🎶 at the top. موسيقى هادية، مقفولة لحد ما حد يدوس 🎶.</p>
    <label><input type="checkbox" data-zs="mon" ${M.on?"checked":""}> Music on</label>
    <div class="zrow"><span>Volume</span><input type="range" min="1" max="10" value="${M.vol}" data-zs="vol"></div>
    <div class="zrow"><span>New tune</span><select data-zs="every">${[["visit","Every time the app opens"],["day","Every day"],["week","Every week"],["never","Keep the same tune"]].map(([v,t])=>`<option value="${v}" ${M.every===v?"selected":""}>${t}</option>`).join("")}</select></div>`;
  host.appendChild(card);
}
document.addEventListener("change", e=>{
  const d=e.target.dataset; if(!d || !d.zs) return; const L=LK(), M=MU(), v=e.target;
  if(d.zs==="force"){ if(v.value==="") delete L.force[d.z]; else L.force[d.z]=+v.value; }
  else if(["rot","kid","trans","intro"].includes(d.zs)) L[d.zs]=v.checked;
  else if(d.zs==="mon"){ M.on=v.checked; M.on?musStart(ZCUR||"parent"):musStop(); musBtn(); }
  else if(d.zs==="vol"){ M.vol=+v.value; if(M.on) musStart(ZCUR||"parent"); }
  else if(d.zs==="every"){ M.every=v.value; if(M.on){ MUS.song=null; MUS.z=null; musStart(ZCUR||"parent"); } }
  save(); zApply(ZCUR||"parent", true);
});

/* ---- clicks on our own buttons ---- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-zx]"); if(!t) { const en=document.getElementById("zentry"); if(en && !en.hidden && e.target===en) closeEntry(); return; }
  e.stopPropagation(); e.preventDefault();
  const a=t.dataset.zx, z=ZCUR||"galaxy", M=MU(), L=LK();
  if(a==="close") return closeEntry();
  if(a==="looks"){ try{sfx.tap();}catch(_){} return showLooks(z); }
  if(a==="pick"){ L.pick[z]={w:weekNo(), i:+t.dataset.i}; save(); zApply(z,true); try{sfx.ok();}catch(_){} return showLooks(z); }
  if(a==="music"){ M.on=!M.on; save(); musBtn(); if(M.on){ musStart(z); toast("Music on 🎵 الموسيقى اشتغلت"); } else { musStop(); toast("Music off الموسيقى اتقفلت"); } if(view.name==="parent") render(); return; }
  if(a==="nexttune"){ M.n=(M.n||0)+1; save(); MUS.song=null; MUS.z=null; musStart(z); return toast("New tune 🎶 مزيكا جديدة"); }
}, true);

/* ---- hook into the app's render ---- */
const baseRender = render;
render = function(){
  const r = baseRender.apply(this, arguments);
  try{
    ensureDock(); musBtn();
    const z=zoneOf(), L=LK();
    if(z!==ZCUR){
      const first = ZCUR===null; ZCUR=z; LASTZ=z;
      if(!first && L.trans) playTrans(z);
      zApply(z);
      if(MU().on && MUS.ctx) musStart(z);
      const wantIntro = !first && L.intro && !ZONES[z].calm && L.seen[z]!==today() && S.child && S.child.name;
      if(wantIntro){ L.seen[z]=today(); save(); setTimeout(()=>showEntry(z,true), L.trans?1050:50); }
      else if(z==="parent") closeEntry();
    } else zApply(z);
    if(view.name==="game") gameGuide(z);
    if(view.name==="parent") parentCard();
  }catch(e){ console.error("v15 zones", e); }
  return r;
};
window.Zones15 = {zoneOf, skinOf, skinIdx, weekNo, apply:zApply, entry:showEntry, looks:showLooks, trans:playTrans};
try{ render(); }catch(e){}
})();
</script>
